 en:["Say: He is Allah, the One.","Allah, the Eternal Refuge.","He neither begets nor was begotten,","and there is none comparable to Him."]},
113:{ar:["قُلْ أَعُوذُ بِرَبِّ ٱلْفَلَقِ","مِن شَرِّ مَا خَلَقَ","وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ","وَمِن شَرِّ ٱلنَّفَّٰثَٰتِ فِى ٱلْعُقَدِ","وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ"],
 en:["Say: I seek refuge in the Lord of daybreak,","from the evil of what He created,","from the evil of darkness when it settles,","from the evil of those who blow on knots,","and from the evil of an envier when he envies."]},
114:{ar:["قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ","مَلِكِ ٱلنَّاسِ","إِلَٰهِ ٱلنَّاسِ","مِن شَرِّ ٱلْوَسْوَاسِ ٱلْخَنَّاسِ","ٱلَّذِى يُوَسْوِسُ فِى صُدُورِ ٱلنَّاسِ","مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ"],
 en:["Say: I seek refuge in the Lord of mankind,","the King of mankind,","the God of mankind,","from the evil of the whisperer who withdraws,","who whispers in the hearts of mankind,","from among jinn and mankind."]}};

{ar:"دَعْ مَا يَرِيبُكَ إِلَى مَا لَا يَرِيبُكَ",en:"Leave what makes you doubt for what does not.",src:"Jami at-Tirmidhi 2518",topic:"Wisdom"},

{ar:"كُنْ فِي الدُّنْيَا كَأَنَّكَ غَرِيبٌ أَوْ عَابِرُ سَبِيلٍ",en:"Be in this world as if you were a stranger or a traveller.",src:"Sahih al-Bukhari 6416",topic:"Wisdom"},
{ar:"الْمُؤْمِنُ لِلْمُؤْمِنِ كَالْبُنْيَانِ يَشُدُّ بَعْضُهُ بَعْضًا",en:"The believer to the believer is like a building, each part strengthening the other.",src:"Sahih al-Bukhari 481, Sahih Muslim 2585",topic:"Community"},
{ar:"مَنْ نَفَّسَ عَنْ مُؤْمِنٍ كُرْبَةً مِنْ كُرَبِ الدُّنْيَا نَفَّسَ اللَّهُ عَنْهُ كُرْبَةً مِنْ كُرَبِ يَوْمِ الْقِيَامَةِ",en:"Whoever relieves a believer of a hardship in this world, Allah will relieve him of a hardship on the Day of Resurrection.",src:"Sahih Muslim 2699",topic:"Community"},
{ar:"ارْحَمُوا مَنْ فِي الْأَرْضِ يَرْحَمْكُمْ مَنْ فِي السَّمَاءِ",en:"Show mercy to those on earth and the One in heaven will show mercy to you.",src:"Sunan Abi Dawud 4941, Jami at-Tirmidhi 1924",topic:"Mercy"},
{ar:"الْكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ",en:"A good word is charity.",src:"Sahih al-Bukhari 2989, Sahih Muslim 1009",topic:"Charity"},
{ar:"مَا زَالَ جِبْرِيلُ يُوصِينِي بِالْجَارِ حَتَّى ظَنَنْتُ أَنَّهُ سَيُوَرِّثُهُ",en:"Jibril kept advising me about the neighbour until I thought he would make him an heir.",src:"Sahih al-Bukhari 6014, Sahih Muslim 2624",topic:"Community"},
{ar:"أَحَبُّ الْأَعْمَالِ إِلَى اللَّهِ أَدْوَمُهَا وَإِنْ قَلَّ",en:"The most beloved deeds to Allah are the most consistent, even if small.",src:"Sahih al-Bukhari 6464, Sahih Muslim 783",topic:"Worship"},
{ar:"مَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللَّهُ لَهُ بِهِ طَرِيقًا إِلَى الْجَنَّةِ",en:"Whoever takes a path seeking knowledge, Allah makes easy for him a path to Paradise.",src:"Sahih Muslim 2699",topic:"Knowledge"},
{ar:"إِذَا مَاتَ ابْنُ آدَمَ انْقَطَعَ عَمَلُهُ إِلَّا مِنْ ثَلَاثٍ: صَدَقَةٍ جَارِيَةٍ، أَوْ عِلْمٍ يُنْتَفَعُ بِهِ، أَوْ وَلَدٍ صَالِحٍ يَدْعُو لَهُ",en:"When a person dies his deeds end except three: ongoing charity, knowledge that benefits others, or a righteous child who prays for him.",src:"Sahih Muslim 1631",topic:"Charity"},
{ar:"بُنِيَ الْإِسْلَامُ عَلَى خَمْسٍ",en:"Islam is built on five pillars.",src:"Sahih al-Bukhari 8, Sahih Muslim 16",topic:"Worship"},
{ar:"لَا يَدْخُلُ الْجَنَّةَ مَنْ كَانَ فِي قَلْبِهِ مِثْقَالُ ذَرَّةٍ مِنْ كِبْرٍ",en:"No one will enter Paradise who has an atom's weight of pride in his heart.",src:"Sahih Muslim 91",topic:"Character"},
{ar:"مَنْ لَا يَرْحَمْ لَا يُرْحَمْ",en:"Whoever does not show mercy will not be shown mercy.",src:"Sahih al-Bukhari 5997, Sahih Muslim 2318",topic:"Mercy"},
{ar:"إِنَّ مِنْ أَحَبِّكُمْ إِلَيَّ أَحْسَنَكُمْ أَخْلَاقًا",en:"Among the most beloved to me are those with the best character.",src:"Sahih al-Bukhari 3559",topic:"Character"},
{ar:"أَكْمَلُ الْمُؤْمِنِينَ إِيمَانًا أَحْسَنُهُمْ خُلُقًا",en:"The believers with the most complete faith are those with the best character.",src:"Sunan Abi Dawud 4682, Jami at-Tirmidhi 1162",topic:"Character"},
{ar:"الْيَدُ الْعُلْيَا خَيْرٌ مِنَ الْيَدِ السُّفْلَى",en:"The giving hand is better than the receiving hand.",src:"Sahih al-Bukhari 1429, Sahih Muslim 1033",topic:"Charity"},
{ar:"مَا نَقَصَتْ صَدَقَةٌ مِنْ مَالٍ",en:"Charity never decreases wealth.",src:"Sahih Muslim 2588",topic:"Charity"},

{ar:"مَنْ صَامَ رَمَضَانَ إِيمَانًا وَاحْتِسَابًا غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ",en:"Whoever fasts Ramadan with faith and seeking reward, his previous sins are forgiven.",src:"Sahih al-Bukhari 38, Sahih Muslim 760",topic:"Worship"},
{ar:"الصِّيَامُ جُنَّةٌ",en:"Fasting is a shield.",src:"Sahih al-Bukhari 1894, Sahih Muslim 1151",topic:"Worship"},
{ar:"مَنْ قَامَ لَيْلَةَ الْقَدْرِ إِيمَانًا وَاحْتِسَابًا غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ",en:"Whoever stands in prayer on the Night of Decree with faith and seeking reward, his previous sins are forgiven.",src:"Sahih al-Bukhari 1901, Sahih Muslim 760",topic:"Worship"},
{ar:"الدُّعَاءُ هُوَ الْعِبَادَةُ",en:"Dua is worship.",src:"Jami at-Tirmidhi 2969, Sunan Abi Dawud 1479",topic:"Worship"},
{ar:"كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ ثَقِيلَتَانِ فِي الْمِيزَانِ حَبِيبَتَانِ إِلَى الرَّحْمَنِ: سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ",en:"Two words light on the tongue, heavy on the scale, beloved to the Most Merciful: Subhan Allah wa bihamdihi, Subhan Allah al-Azim.",src:"Sahih al-Bukhari 6406, Sahih Muslim 2694",topic:"Dhikr"},
{ar:"مَنْ قَالَ سُبْحَانَ اللَّهِ وَبِحَمْدِهِ فِي يَوْمٍ مِائَةَ مَرَّةٍ حُطَّتْ خَطَايَاهُ وَإِنْ كَانَتْ مِثْلَ زَبَدِ الْبَحْرِ",en:"Whoever says Subhan Allah wa bihamdihi a hundred times a day, his sins are wiped away even if they are like the foam of the sea.",src:"Sahih al-Bukhari 6405, Sahih Muslim 2691",topic:"Dhikr"},
{ar:"مَثَلُ الَّذِي يَذْكُرُ رَبَّهُ وَالَّذِي لَا يَذْكُرُ رَبَّهُ مَثَلُ الْحَيِّ وَالْمَيِّتِ",en:"The example of one who remembers his Lord and one who does not is like the living and the dead.",src:"Sahih al-Bukhari 6407",topic:"Dhikr"},
{ar:"الْمُسْلِمُ أَخُو الْمُسْلِمِ لَا يَظْلِمُهُ وَلَا يُسْلِمُهُ، وَمَنْ كَانَ فِي حَاجَةِ أَخِيهِ كَانَ اللَّهُ فِي حَاجَتِهِ",en:"A Muslim is the brother of a Muslim: he does not wrong him or abandon him. Whoever helps his brother's need, Allah helps his need.",src:"Sahih al-Bukhari 2442, Sahih Muslim 2580",topic:"Community"},
{ar:"إِنَّمَا بُعِثْتُ لِأُتَمِّمَ صَالِحَ الْأَخْلَاقِ",en:"I was sent only to perfect good character.",src:"Musnad Ahmad 8952",topic:"Character"},
{ar:"الْبِرُّ حُسْنُ الْخُلُقِ",en:"Righteousness is good character.",src:"Sahih Muslim 2553",topic:"Character"},
{ar:"رِضَا الرَّبِّ فِي رِضَا الْوَالِدِ",en:"The pleasure of the Lord is in the pleasure of the parent.",src:"Jami at-Tirmidhi 1899",topic:"Family"},
{ar:"أُمُّكَ ثُمَّ أُمُّكَ ثُمَّ أُمُّكَ ثُمَّ أَبُوكَ",en:"Your mother, then your mother, then your mother, then your father.",src:"Sahih al-Bukhari 5971, Sahih Muslim 2548",topic:"Family"},
{ar:"خَيْرُكُمْ خَيْرُكُمْ لِأَهْلِهِ وَأَنَا خَيْرُكُمْ لِأَهْلِي",en:"The best of you are the best to their families, and I am the best to my family.",src:"Jami at-Tirmidhi 3895",topic:"Family"},
{ar:"مَنْ غَشَّنَا فَلَيْسَ مِنَّا",en:"Whoever cheats us is not one of us.",src:"Sahih Muslim 101",topic:"Honesty"},
{ar:"التَّاجِرُ الصَّدُوقُ الْأَمِينُ مَعَ النَّبِيِّينَ وَالصِّدِّيقِينَ وَالشُّهَدَاءِ",en:"The honest, trustworthy merchant will be with the prophets, the truthful and the martyrs.",src:"Jami at-Tirmidhi 1209",topic:"Honesty"},
{ar:"آيَةُ الْمُنَافِقِ ثَلَاثٌ: إِذَا حَدَّثَ كَذَبَ، وَإِذَا وَعَدَ أَخْلَفَ، وَإِذَا اؤْتُمِنَ خَانَ",en:"The signs of a hypocrite are three: when he speaks he lies, when he promises he breaks it, and when trusted he betrays.",src:"Sahih al-Bukhari 33, Sahih Muslim 59",topic:"Honesty"},

{ar:"أَلَا وَإِنَّ فِي الْجَسَدِ مُضْغَةً إِذَا صَلَحَتْ صَلَحَ الْجَسَدُ كُلُّهُ",en:"In the body there is a piece of flesh: if it is sound, the whole body is sound. It is the heart.",src:"Sahih al-Bukhari 52, Sahih Muslim 1599",topic:"Heart"},
{ar:"نِعْمَتَانِ مَغْبُونٌ فِيهِمَا كَثِيرٌ مِنَ النَّاسِ: الصِّحَّةُ وَالْفَرَاغُ",en:"Two blessings many people lose out on: health and free time.",src:"Sahih al-Bukhari 6412",topic:"Wisdom"},
{ar:"تَهَادَوْا تَحَابُّوا",en:"Give gifts to one another and you will love one another.",src:"Al-Adab al-Mufrad 594",topic:"Community"},
{ar:"لَا تَحَاسَدُوا وَلَا تَبَاغَضُوا، وَكُونُوا عِبَادَ اللَّهِ إِخْوَانًا",en:"Do not envy or hate one another, and be servants of Allah as brothers.",src:"Sahih al-Bukhari 6064, Sahih Muslim 2559",topic:"Community"},
{ar:"إِيَّاكُمْ وَالظَّنَّ فَإِنَّ الظَّنَّ أَكْذَبُ الْحَدِيثِ",en:"Beware of suspicion, for suspicion is the falsest speech.",src:"Sahih al-Bukhari 6066, Sahih Muslim 2563",topic:"Character"},
{ar:"مَنْ يُحْرَمِ الرِّفْقَ يُحْرَمِ الْخَيْرَ",en:"Whoever is deprived of gentleness is deprived of good.",src:"Sahih Muslim 2592",topic:"Mercy"}];

/* ---------- prayer maths (offline, standard solar algorithm) ---------- */
const rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI,sn=d=>Math.sin(rad(d)),cs=d=>Math.cos(rad(d)),tn=d=>Math.tan(rad(d));
const fix=(a,b)=>{a=a-b*Math.floor(a/b);return a<0?a+b:a};
function julian(y,m,d){if(m<=2){y-=1;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sunPos(jd){const D=jd-2451545,g=fix(357.529+.98560028*D,360),q=fix(280.459+.98564736*D,360),Ls=fix(q+1.915*sn(g)+.02*sn(2*g),360),e=23.439-3.6e-7*D;const RA=fix(deg(Math.atan2(cs(e)*sn(Ls),cs(Ls)))/15,24);return{dec:deg(Math.asin(sn(e)*sn(Ls))),eq:q/15-RA}}
function prayerTimes(y,m,d,lat,lng,M){
  const jd=julian(y,m,d)-lng/360;
  const mid=x=>fix(12-sunPos(jd+x).eq,24);
  const ang=(a,x,ccw)=>{const dec=sunPos(jd+x).dec,v=(-sn(a)-sn(dec)*sn(lat))/(cs(dec)*cs(lat));if(v<-1||v>1)return NaN;return mid(x)+(ccw?-1:1)*deg(Math.acos(v))/15};
  const asr=x=>{const dec=sunPos(jd+x).dec;return ang(-deg(Math.atan(1/(1+tn(Math.abs(lat-dec))))),x)};
  let p={fajr:5/24,sunrise:6/24,dhuhr:.5,asr:13/24,maghrib:18/24,isha:18/24};
  for(let i=0;i<2;i++){p={fajr:ang(M.f,p.fajr,true),sunrise:ang(.833,p.sunrise,true),dhuhr:mid(p.dhuhr)+1/60,asr:asr(p.asr),maghrib:ang(.833,p.maghrib),isha:M.im?0:ang(M.i,p.isha)}}
  if(M.im)p.isha=p.maghrib+M.im/60;
  const base=Date.UTC(y,m-1,d),o={};
  for(const k in p)o[k]=new Date(base+(p[k]-lng/15)*36e5);
  return o}
function qibla(lat,lng){const a=rad(lat),b=rad(21.4225),dl=rad(39.8262-lng);return fix(deg(Math.atan2(Math.sin(dl),Math.cos(a)*Math.tan(b)-Math.sin(a)*Math.cos(dl))),360)}
function ymdIn(tz,date){const p=new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(date);const g=k=>+p.find(x=>x.type===k).value;return[g("year"),g("month"),g("day")]}

function searchResults(q){
  q=q.trim().toLowerCase();const out=[];if(!q)return `<div class="card flat muted">${esc(L("Type to search across posts, surahs, hadith and reciters.","اكتب للبحث في المنشورات والسور والأحاديث والقرّاء."))}</div>`;
  const posts=allPosts().filter(p=>(p.body+" "+(p.alt||"")+" "+p.u).toLowerCase().includes(q));
  const sur=AR.map((a,i)=>[i+1,a,EN[i]]).filter(s=>s[1].includes(q)||s[2].toLowerCase().includes(q)).slice(0,6);
  const had=HADITH.filter(h=>(h.en+h.ar+h.topic+h.src).toLowerCase().includes(q));
  const qr=QARIS.filter(x=>(x[0]+x[1]).toLowerCase().includes(q));
  if(sur.length)out.push(`<div class="card"><b>${esc(t("quran"))}</b>${sur.map(s=>`<div><a href="#quran" data-act="opensurah" data-n="${s[0]}">${s[0]}. ${esc(s[2])} · ${esc(s[1])}</a></div>`).join("")}</div>`);
  if(had.length)out.push(`<div class="card"><b>${esc(t("hadith"))}</b>${had.map(h=>`<div class="sm" style="margin-top:6px">${esc(h.en)} <span class="muted">(${esc(h.src)})</span></div>`).join("")}</div>`);
  if(qr.length)out.push(`<div class="card"><b>${esc(t("qaris"))}</b>${qr.map(x=>`<div>${esc(x[0])} · ${esc(x[1])}</div>`).join("")}</div>`);
  out.push(...posts.map(postHTML));
  return out.length?out.join(""):`<div class="card flat muted">${esc(L("No results.","لا نتائج."))}</div>`}

const LOAD={};
function loadSurah(n){
  if(TEXT[n]||LOAD[n]==="loading")return;
  const c=store.get("q"+n,null);if(c){TEXT[n]=c;return}
  LOAD[n]="loading";
  fetch("https://api.alquran.cloud/v1/surah/"+n+"/editions/quran-uthmani,en.sahih").then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{
    const ar=j.data[0].ayahs.map(a=>a.text),en=j.data[1].ayahs.map(a=>a.text);
    const norm=x=>x.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g,"").replace(/\u0671/g,"\u0627");
    if(n!==1&&n!==9&&norm(ar[0]).indexOf("\u0628\u0633\u0645 \u0627\u0644\u0644\u0647 \u0627\u0644\u0631\u062D\u0645\u0646 \u0627\u0644\u0631\u062D\u064A\u0645")===0){const w=ar[0].split(" ");if(w.length>4)ar[0]=w.slice(4).join(" ")}
    TEXT[n]={ar:ar,en:en,live:true};store.set("q"+n,TEXT[n]);LOAD[n]="ok";
  }).catch(()=>{LOAD[n]="err"}).then(()=>{if(S.surah===n&&(location.hash.slice(1)||"more")==="quran")render()});
}

const MQ={list:null,state:"idle"},QS={i:-1,m:0,cur:0};
const mqNorm=x=>x.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/(^|\s)(عبد|ابو|ابي)\s+/g,"$1$2").replace(/\s+/g," ").trim();
const mqKey=x=>{const t=mqNorm(x).split(" ").filter(Boolean).map(w=>w.replace(/^ال/,""));return t.length?t[0]+"|"+t[t.length-1]:""};
function mqFor0(i){const nm=x=>mqNorm(x).split(" ").map(w=>w.replace(/^ال/,"")).filter(w=>w.length>1),k=mqKey(QARIS[i][1]),tk=nm(QARIS[i][1]),seen=new Set();
 return (MQ.list||[]).filter(r=>{if(mqKey(r.name)===k)return true;const rt=nm(r.name);if(rt.length<2)return false;return rt.every(w=>tk.includes(w))||tk.every(w=>rt.includes(w))||(rt[0]===tk[0]&&rt[rt.length-1]===tk[tk.length-1])}).flatMap(r=>(r.moshaf||[]).map(m=>Object.assign({},m,{rname:r.name}))).filter(m=>{if(!m.server||!m.surah_list||seen.has(m.server))return false;seen.add(m.server);return true}).sort((a,b)=>(+b.surah_total||0)-(+a.surah_total||0))}
const MQU=["https://www.mp3quran.net/api/v3/reciters?language=ar","https://api.mp3quran.net/api/v3/reciters?language=ar","https://mp3quran.net/api/v3/reciters?language=ar","https://www.mp3quran.net/api/v3/reciters?language=eng"];
async function mqFetchAny(){for(const u of MQU){try{const ac=new AbortController(),to=setTimeout(()=>ac.abort(),15000);const r=await fetch(u,{signal:ac.signal});clearTimeout(to);if(!r.ok)continue;const j=await r.json();if(j&&Array.isArray(j.reciters)&&j.reciters.length)return j.reciters}catch(e){}}return null}
async function mqJ(){if(MQ.list&&MQ.list.length)return{reciters:MQ.list};const l=await mqFetchAny()||store.get("mqc",null);if(!l||!l.length)throw new Error("mp3quran");MQ.list=l;MQ.state="ok";return{reciters:l}}
/* built-in last-resort servers (used only when the mp3quran list cannot be loaded at all) */
const FBS=[[0,"afs","server8"],[1,"basit","server7"],[2,"husr","server13"],[3,"maher","server12"],[4,"s_gmd","server7"],[5,"sds","server11"],[6,"shur","server7"],[7,"minsh","server10"],[8,"yasser","server11"],[17,"s_bud","server6"]];
const ALL114=Array.from({length:114},(_,i)=>i+1).join(",");
function mqFallback(i){const f=FBS.find(x=>x[0]===i);return f?[{name:"حفص عن عاصم - مرتل",rname:QARIS[i][1],server:"https://"+f[2]+".mp3quran.net/"+f[1]+"/",surah_list:ALL114,surah_total:114}]:[]}
function loadReciters(){MQ.state="loading";
  mqFetchAny().then(l=>{const c=store.get("mqc",null);if(l){MQ.list=l;MQ.state="ok";try{localStorage.setItem("dawa:mqc",JSON.stringify(l))}catch(e){}}else if(c&&c.length){MQ.list=c;MQ.state="ok"}else MQ.state="err"}).then(()=>{if(["qari","qaris","reciters2","sheikh"].includes(location.hash.slice(1)))render()});}
function mqFor(i){let r=mqFor0(i);if(r.length)return r;
 const nm=x=>mqNorm(x).split(" ").map(w=>w.replace(/^ال/,"")).filter(w=>w.length>1),tk=nm(QARIS[i][1]);let best=null,bs=0;
 (MQ.list||[]).forEach(c=>{const rt=nm(c.name),sh=rt.filter(w=>tk.includes(w)).length;if(sh>bs&&sh>=2){bs=sh;best=c}});
 if(best){const seen=new Set();r=(best.moshaf||[]).map(m=>Object.assign({},m,{rname:best.name})).filter(m=>{if(!m.server||!m.surah_list||seen.has(m.server))return false;seen.add(m.server);return true}).sort((a,b)=>(+b.surah_total||0)-(+a.surah_total||0));if(r.length)return r}
 return mqFallback(i)}
function qPlay(n){const ms=QS.ms||[],m=ms[QS.m],a=$("#qa");if(!m||!a)return;QS.cur=n;$("#qmsg").textContent="";
  a.src=m.server.replace(/\/?$/,"/")+String(n).padStart(3,"0")+".mp3";a.play().catch(()=>{});$("#qnow").textContent=n+". "+EN[n-1]+" · "+AR[n-1];
  document.querySelectorAll("[data-row]").forEach(r=>r.classList.toggle("playing",+r.dataset.row===n));}
document.addEventListener("ended",e=>{if(e.target.id!=="qa")return;const m=(QS.ms||[])[QS.m];if(!m)return;const av=new Set((QS.ms||[]).flatMap(x=>String(x.surah_list).split(",").map(Number)));for(let n=QS.cur+1;n<=114;n++)if(av.has(n)){qPlay(n);return}},true);

V.qari=()=>{

  const i=S.qid!=null?"r"+S.qid:(S.qari!=null&&QARIS[S.qari]?S.qari:0),q=S.qid!=null?[R?R.name:"…",R?R.name:"…"]:QARIS[i];
  const title=head(S.lang==="ar"?q[1]:q[0],S.qid!=null?L("Recitations","التلاوات"):(S.lang==="ar"?q[0]:q[1]));

  if(QS.i!==i){QS.i=i;QS.cur=0;let b=0;ms.forEach((m,k)=>{const sc0=x=>(S.qid!=null&&/مجود/.test(x.name)?2000:0)+(/حفص/.test(x.name)&&/مرتل/.test(x.name)?1000:0)+(+x.surah_total||0);if(sc0(m)>sc0(ms[b]))b=k});QS.m=b}
  const m=ms[Math.min(QS.m,ms.length-1)],av=new Set(ms.flatMap(x=>String(x.surah_list).split(",").map(Number)));

  return title+back+`<div class="card" style="position:sticky;top:8px;z-index:5;display:grid;gap:8px"><b id="qnow">${esc(L("Choose a surah to play","اختر سورة للاستماع"))}</b><audio id="qa" controls preload="none" style="width:100%"></audio><div class="muted sm" id="qmsg"></div>${ms.length>1?`<select id="moshaf" aria-label="Recitation">${ms.map((x,k)=>`<option value="${k}" ${k===QS.m?"selected":""}>${esc((x.rname&&mqNorm(x.rname)!==mqNorm(x.name)?x.rname+" — ":"")+x.name)} (${x.surah_total})</option>`).join("")}</select>`:`<span class="muted sm">${esc(m.name)} · ${m.surah_total} ${esc(L("surahs","سورة"))}</span>`}</div>${rows}`;
};

  const r=(location.hash.slice(1)||"more");const route=V[r]&&r!=="home"&&r!=="explore"?r:"more";
  clearInterval(timer);stopQibla();
  buildNav(route);
  $("#main").innerHTML=V[route]();
  if(route==="prayer"){startPrayer();qdraw()}
  if(route==="qaris"&&$("#qlist"))mujUpdate();
  if(route==="explore")$("#results").innerHTML=searchResults(S.q||"");
  window.scrollTo(0,0);try{postRender(route)}catch(e){console.error(e)}
}

main.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,card=b.closest("[data-id]"),id=card&&card.dataset.id,keep=()=>{const y=window.scrollY;render();window.scrollTo(0,y)};
  if(act==="join"){const v=$("#uname").value.trim().replace(/[^A-Za-z0-9_.]/g,"");if(v.length<3){$("#uname").setCustomValidity("");$("#uname").placeholder="3+ letters or numbers";return}S.user=v;save();keep()}
  else if(act==="post"){const v=$("#newpost").value.trim();if(!v)return;S.posts.unshift({id:"u"+Date.now(),u:S.user,at:Date.now(),body:v,likes:0,dis:0});save();keep()}
  else if(act==="like"||act==="dislike"){S.react[id]=S.react[id]===act?undefined:act;if(!S.react[id])delete S.react[id];save();keep()}
  else if(act==="save"){S.saved=S.saved.includes(id)?S.saved.filter(x=>x!==id):S.saved.concat(id);save();keep()}
  else if(act==="report"){if(!S.reported.includes(id))S.reported.push(id);save();keep()}
  else if(act==="alt"){S.revealed["alt"+id]=!S.revealed["alt"+id];save();keep()}
  else if(act==="cmt"){S.revealed["c"+id]=!S.revealed["c"+id];keep()}
  else if(act==="quick"){const i=$("#cin-"+id);if(i)i.value=b.dataset.s}
  else if(act==="send"){const i=$("#cin-"+id),v=i&&i.value.trim();if(!v)return;if(!S.user){i.value="";i.placeholder="Choose a display name on Home first";return}(S.comments[id]=S.comments[id]||[]).push({u:S.user,t:v});save();keep()}
  else if(act==="tag"){S.q=b.dataset.s;$("#q").value=S.q;$("#results").innerHTML=searchResults(S.q)}
  else if(act==="surah"||act==="opensurah"){S.surah=+b.dataset.n;S.hifz=false;if(act==="surah")render();else{location.hash="quran"}}
  else if(act==="back"){S.surah=null;render()}
  else if(act==="hifz"){S.hifz=!S.hifz;keep()}
  else if(act==="hifzreset"){for(const k in S.revealed)if(k[0]==="h")delete S.revealed[k];save();keep()}
  else if(act==="reveal"){S.revealed[b.dataset.k]=true;save();keep()}
  else if(act==="qstart"){startQibla()}
  else if(act==="yt"){b.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${b.dataset.id}?autoplay=1&rel=0" title="YouTube video" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;b.removeAttribute("data-act");b.style.cursor="default"}
  else if(act==="ac"){S.ac=b.dataset.s;save();keep()}
  else if(act==="plan"){S.plan=+b.dataset.i;location.hash="plan"}
  else if(act==="pstep"){const i=+b.dataset.i,k=+b.dataset.k;S.plans=S.plans||{};const a=S.plans[i]||[];S.plans[i]=a.includes(k)?a.filter(v=>v!==k):a.concat(k);save();keep()}
  else if(act==="popen"){S.surah=+b.dataset.n;save();location.hash="quran"}
  else if(act==="qari"){S.qari=+b.dataset.i;S.qid=null;location.hash="qari"}
  else if(act==="qid"){S.qid=+b.dataset.id;QS.i=-1;location.hash="qari"}
  else if(act==="qplay"){qPlay(+b.dataset.n)}
  else if(act==="qf"){S.qf=b.dataset.s;keep()}
  else if(act==="dhikr"){const i=+b.dataset.i,n=ADHKAR[i].n;S.adhkar.done[i]=Math.min((S.adhkar.done[i]||0)+1,n);
    if(ADHKAR.every((a,k)=>!a.core||(S.adhkar.done[k]||0)>=a.n)&&S.streak.last!==dayKey()){const y=new Date(Date.now()-864e5).toDateString();S.streak={n:S.streak.last===y?S.streak.n+1:1,last:dayKey()}}
    save();keep()}
  else if(act==="totafsir"){X.sur=+b.dataset.n;location.hash="tafsir"}
  else if(act==="rsvp"){const i=+b.dataset.i;S.rsvp=S.rsvp.includes(i)?S.rsvp.filter(x=>x!==i):S.rsvp.concat(i);save();keep()}
});

V.tafsir=()=>{if(!tfm()[X.tf])X.tf=Object.keys(tfm())[0];setTimeout(xTafsir);return head(t("tafsir"),L("The full Quran with the best-known tafsir books","المصحف كاملًا مع أشهر كتب التفسير"))+`<select id="x-sur">${AR.map((a,i)=>`<option value="${i+1}" ${X.sur===i+1?"selected":""}>${i+1}. ${esc(a)}</option>`).join("")}</select>`+chips(Object.entries(tfm()).map(([k,v])=>[k,v[1]]),X.tf,"tf")+`<div class="row"><button class="chip" data-x="tfopen" data-v="1">${esc(L("Expand all","فتح كل التفاسير"))}</button><button class="chip" data-x="tfopen" data-v="0">${esc(L("Collapse all","طي الكل"))}</button></div><div id="x-tst"></div><div id="x-out" class="card flat">…</div>`};
let tfSeq=0;
async function xTafsir(){const my=++tfSeq,sur=X.sur,k=X.tf;
 try{const q=await xj(`https://api.alquran.cloud/v1/surah/${sur}/quran-uthmani`);if(my!==tfSeq)return;
  const bs="\u0628\u0633\u0645 \u0627\u0644\u0644\u0647 \u0627\u0644\u0631\u062D\u0645\u0646 \u0627\u0644\u0631\u062D\u064A\u0645",norm=x=>x.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g,"").replace(/\u0671/g,"\u0627");
  const A=q.data.ayahs.map(a=>{let tx=a.text;if(a.numberInSurah===1&&sur!==1&&sur!==9&&norm(tx).indexOf(bs)===0){const w=tx.split(" ");if(w.length>4)tx=w.slice(4).join(" ")}return{n:a.numberInSurah,t:tx}});
  const clean=x=>esc(String(x).replace(/<br\s*\/?>/gi,"\n").replace(/<[^>]*>/g,""));
  const draw=(tf,st)=>{let prev=0;const bm=XS.g("bm",[]),nm=tfm()[k][1];
   xe("x-tst",st==="load"?`<div class="notice">${esc(L("Loading the tafsir…","جارٍ تحميل التفسير…"))}</div>`:st==="err"?`<div class="notice">⚠️ ${esc(L("Could not load this tafsir. Check your internet connection or try another book.","تعذر تحميل هذا التفسير. تأكد من الإنترنت أو جرّب كتابًا آخر."))} <button class="chip" data-x="tfretry">${esc(L("Retry","إعادة المحاولة"))}</button></div>`:"");
   xe("x-out",A.map(a=>{let body;
    if(st==="load")body=`<span class="muted sm">…</span>`;
    else if(st==="err")body=`<span class="muted sm">—</span>`;
    else if(tf[a.n]){prev=a.n;body=clean(tf[a.n])}
    else body=esc(prev?L("This ayah is explained together with ayah "+prev+" above.","يُشرح هذا الموضع ضمن تفسير الآية "+prev+" أعلاه."):L("No text for this ayah in this book.","لا يوجد نص لهذه الآية في هذا التفسير."));
    return `<div class="card" style="margin-bottom:10px"><p class="xq">${esc(a.t)} ﴿${a.n}﴾</p><div class="row" style="margin-top:6px"><button class="chip" data-x="bm" data-v="${sur}:${a.n}">${bm.includes(sur+":"+a.n)?"★":"☆"} ${esc(L("Save","احفظ"))}</button></div><details ${X.tfo!==false?"open":""}><summary class="sm muted" style="cursor:pointer;padding:6px 0">${esc(L("Tafsir","التفسير"))} · ${esc(nm)}</summary><p style="line-height:1.9;margin:0;white-space:pre-wrap">${body}</p></details></div>`}).join(""))};
  draw(null,"load");
  const tf=await tfGet(k,sur);if(my!==tfSeq)return;
  draw(tf,tf?"ok":"err")}
 catch(e){if(my===tfSeq){xerr("x-out",e.message);xe("x-tst",`<div class="row"><button class="chip" data-x="tfretry">${esc(L("Retry","إعادة المحاولة"))}</button></div>`)}}}

const TEN=[["نافع",[["قالون","قالون"],["ورش","ورش"]]],["ابن كثير",[["البزي","البزي"],["قنبل","قنبل"]]],["أبو عمرو البصري",[["الدوري","الدوري عن ابي عمرو"],["السوسي","السوسي"]]],["ابن عامر",[["هشام","هشام"],["ابن ذكوان","ابن ذكوان"]]],["عاصم",[["شعبة","شعبه"],["حفص","حفص"]]],["حمزة",[["خلف عن حمزة","خلف عن حمزه"],["خلاد","خلاد"]]],["الكسائي",[["أبو الحارث","ابي الحارث"],["الدوري","الدوري عن الكسائي"]]],["أبو جعفر",[["ابن وردان","ابن وردان"],["ابن جماز","ابن جماز"]]],["يعقوب",[["رويس","رويس"],["روح","روح"]]],["خلف العاشر",[["إسحاق","اسحاق"],["إدريس","ادريس"]]]];

V.reciters2=()=>{setTimeout(xRec);const r=X.rec;return head(t("reciters2"),L("Filter by style, narration and country","فلتر بالنوع والرواية والبلد"))+`<input type="search" id="x-q" value="${esc(r.q)}" placeholder="${esc(L("Search reciters…","ابحث عن قارئ…"))}">`+chips(Object.entries(KIND),r.kind,"kind")+`<div class="row"><button class="chip" data-x="eg" aria-pressed="${r.eg}">🇪🇬 ${esc(L("Egyptian only","المصريون فقط"))}</button>${r.rw?`<button class="chip" data-x="rw0">✕ ${esc(r.rwl||r.rw)}</button>`:""}</div><details class="card flat"><summary class="sm">${esc(L("Add Egyptian reciter names (one per line)","أضف أسماء قرّاء مصريين (اسم في كل سطر)"))}</summary><textarea id="x-eg" rows="4">${esc((XS.g("eg",[])).join("\n"))}</textarea></details><div class="card" style="position:sticky;top:60px;z-index:5" id="x-now" hidden><b id="x-nt"></b><audio id="x-au" controls style="width:100%"></audio></div><div id="x-out">…</div>`};
async function xRec(){try{const j=await mqJ(),r=X.rec,eg=XEG.concat(XS.g("eg",[])).map(XN);const sn=AR;let n=0;
const html=j.reciters.slice().sort((a,b)=>a.name.localeCompare(b.name,"ar")).filter(c=>{const a=XN(c.name);return(!r.eg||eg.some(e=>a.includes(e)||e.includes(a)))&&(!r.q||a.includes(XN(r.q)))}).map(c=>{const ms=(c.moshaf||[]).map(m=>({m,k:kindOf(m.name),sl:(m.surah_list||"").split(",").filter(Boolean).map(Number)})).filter(o=>o.sl.length&&(!r.kind||o.k===r.kind)&&(!r.rw||XN(o.m.name).includes(r.rw)));if(!ms.length)return"";n++;
return`<details class="card" style="margin-bottom:8px"><summary><b>${esc(c.name)}</b></summary>${ms.map(o=>`<p class="sm" style="color:var(--primary);font-weight:700;margin:10px 0 4px">${esc(o.m.name)} · ${esc(KIND[o.k])} · ${o.sl.length} ${esc(L("surahs","سورة"))}</p><div class="row">${o.sl.map(s=>`<button class="chip" data-x="play" data-u="${esc(o.m.server.replace(/\/?$/,"/")+String(s).padStart(3,"0")+".mp3")}" data-t="${esc(c.name+" — "+(sn[s-1]||s))}">${esc(sn[s-1]||s)}</button>`).join("")}</div>`).join("")}</details>`}).join("");
xe("x-out",`<p class="muted sm">${n} ${esc(L("reciters","قارئ"))} — ${esc(L("only surahs actually recorded in this style are listed","تظهر فقط السور المسجّلة فعلًا بهذا النوع"))}</p>`+(html||`<div class="card flat">${esc(L("No results","لا نتائج"))}</div>`))}catch(e){xerr("x-out",e.message)}}
V.tajweed=()=>head(t("tajweed"),L("Rules + the ten readers and their narrators","أحكام أساسية والقرّاء العشرة ورواتهم"))+`<div class="card"><b>أحكام أساسية</b><p style="line-height:1.9;margin:6px 0 0">النون الساكنة والتنوين: إظهار، إدغام، إقلاب، إخفاء.<br>الميم الساكنة: إخفاء شفوي، إدغام مثلين، إظهار شفوي.<br>المدود: طبيعي (حركتان)، متصل ومنفصل، لازم، عارض للسكون.<br>القلقلة: حروف «قطب جد» إذا سكنت.<br>الغنة: صوت الخيشوم في النون والميم المشددتين.</p></div><p class="muted sm">${esc(L("Tap a narrator to hear reciters who recorded it.","اضغط على الراوي لتسمع من سجّل بروايته."))}</p>`+TEN.map(([q,rs])=>`<div class="card"><b>${esc(q)}</b><div class="row" style="margin-top:8px">${rs.map(([n,k])=>`<button class="chip" data-x="rawi" data-v="${esc(XN(k))}" data-l="${esc(n+" عن "+q)}">${esc(n)}</button>`).join("")}</div></div>`).join("");

XC.seerah=[
["١) العرب قبل البعثة","كانت الجزيرة العربية قبائل متفرقة، وكانت مكة مركزًا دينيًا وتجاريًا بسبب الكعبة ورحلتي الشتاء والصيف، وانتشرت عبادة الأصنام بعد أن غيّر عمرو بن لحي دين إبراهيم، وبقيت بقايا من الحنيفية كزيد بن عمرو بن نفيل وورقة بن نوفل."],
["٢) النسب الشريف","هو محمد بن عبد الله بن عبد المطلب بن هاشم، من قريش من بني هاشم، ويرجع نسبه إلى عدنان ثم إلى إسماعيل بن إبراهيم عليهم السلام. أمه آمنة بنت وهب من بني زهرة."],
["٣) عام الفيل والميلاد","في عام الفيل جاء أبرهة الحبشي بجيشه لهدم الكعبة فأهلكه الله بالطير الأبابيل. وفي هذا العام وُلد النبي ﷺ يوم الاثنين في ربيع الأول، وتوفي أبوه عبد الله وهو حمل، وأرضعته حليمة السعدية في بادية بني سعد."],
["٤) اليتم وشق الصدر","ردّته حليمة إلى أمه بعد حادثة شق الصدر، وتوفيت آمنة بالأبواء وهو في السادسة، فكفله جده عبد المطلب، ولما توفي جده وله ثمان سنين كفله عمه أبو طالب ورعاه رعاية كاملة."],
["٥) الشباب والأمانة","رعى الغنم ثم سافر في التجارة إلى الشام، ولقيه الراهب بحيرى، وشارك في حلف الفضول لنصرة المظلوم. عُرف في قريش بالصادق الأمين، وحكّموه في وضع الحجر الأسود حين اختلفوا فوضعه في ثوب ورفعته القبائل جميعًا."],
["٦) الزواج من خديجة","تاجر في مال خديجة بنت خويلد إلى الشام مع غلامها ميسرة، فأُعجبت بأمانته، وتزوجها وهو في الخامسة والعشرين وهي في الأربعين، وأنجبت له أولاده كلهم إلا إبراهيم: القاسم وعبد الله وزينب ورقية وأم كلثوم وفاطمة."],
["٧) بدء الوحي","كان يتعبد في غار حراء، ونزل عليه جبريل في رمضان وله أربعون سنة بقوله تعالى: «اقرأ باسم ربك الذي خلق». رجع خائفًا إلى خديجة فطمأنته وذهبت به إلى ورقة بن نوفل الذي أخبره أنه نبي هذه الأمة. ثم فتر الوحي ثم نزل: «يا أيها المدثر»."],
["٨) الدعوة السرية","استمرت نحو ثلاث سنين. أسلم أولًا خديجة وعلي بن أبي طالب وزيد بن حارثة وأبو بكر، وأسلم على يد أبي بكر عثمان والزبير وعبد الرحمن بن عوف وسعد وطلحة، واجتمعوا في دار الأرقم بن أبي الأرقم."],
["٩) الجهر بالدعوة","أُمر بقوله: «فاصدع بما تؤمر» و«وأنذر عشيرتك الأقربين»، فصعد الصفا ونادى قريشًا وكذّبه أبو لهب. ثم بدأت قريش بالسخرية والتعذيب."],
["١٠) تعذيب المستضعفين","عُذّب بلال بن رباح وعمار وسمية وياسر وخباب وغيرهم، واستشهدت سمية أول شهيدة في الإسلام، واشترى أبو بكر وأعتق عددًا منهم كبلال."],
["١١) الهجرة إلى الحبشة","أمرهم النبي ﷺ بالهجرة إلى الحبشة لأن بها ملكًا لا يُظلم عنده أحد، فهاجر جماعة فيهم عثمان ورقية وجعفر بن أبي طالب، وقرأ جعفر على النجاشي صدر سورة مريم فبكى وحماهم من وفد قريش."],
["١٢) إسلام حمزة وعمر","أسلم حمزة بن عبد المطلب غضبًا لإيذاء النبي ﷺ ثم ثبت إسلامه، وأسلم عمر بن الخطاب بعد دعوة النبي «اللهم أعزّ الإسلام بأحب الرجلين إليك»، فظهر المسلمون بصلاتهم عند الكعبة."],
["١٣) المقاطعة وشعب أبي طالب","كتبت قريش صحيفة بمقاطعة بني هاشم وبني المطلب في بيع وشراء وزواج، فحُصروا في الشعب نحو ثلاث سنين حتى أكلوا ورق الشجر، ثم نُقضت الصحيفة بعد أن أكلت الأرضة ما فيها من ظلم."],
["١٤) عام الحزن","توفي أبو طالب ثم خديجة بفارق أيام قليلة في السنة العاشرة من البعثة، فاشتد أذى قريش، وخرج النبي ﷺ إلى الطائف يدعو ثقيفًا فردوه وآذوه بالحجارة، فدعا دعاء المستضعفين وأرسل الله إليه ملك الجبال فرفض أن يطبق عليهم الأخشبين وقال: أرجو أن يخرج الله من أصلابهم من يعبد الله."],
["١٥) الإسراء والمعراج","أُسري به ﷺ من المسجد الحرام إلى المسجد الأقصى ثم عُرج به إلى السماوات العلى، وفُرضت الصلوات الخمس بعد تخفيف من خمسين، ولقي الأنبياء في السماوات، وتكذيب قريش وتصديق أبي بكر فسُمّي الصديق."],
["١٦) بيعتا العقبة","عرض نفسه على القبائل في المواسم، فآمن ستة من الخزرج ثم بيعة العقبة الأولى باثني عشر رجلًا وأُرسل معهم مصعب بن عمير، ثم بيعة العقبة الثانية بثلاثة وسبعين رجلًا وامرأتين على نصرته وحمايته كما يحمون نساءهم وأبناءهم."],
["١٧) الهجرة إلى المدينة","أمر المسلمين بالهجرة، وتآمرت قريش على قتله في دار الندوة، فنام علي في فراشه وخرج النبي ﷺ مع أبي بكر واختبآ في غار ثور ثلاثًا، ودليلهما عبد الله بن أريقط، ونزلا بقباء حيث بنى مسجد قباء ثم دخل المدينة في ربيع الأول من السنة الأولى."],
["١٨) تأسيس الدولة في المدينة","بنى المسجد النبوي، وآخى بين المهاجرين والأنصار، وكتب وثيقة المدينة التي نظمت العلاقة مع اليهود وغيرهم، وشُرع الأذان، وفُرض الصيام والزكاة وتحولت القبلة إلى الكعبة في السنة الثانية."],
["١٩) غزوة بدر الكبرى (٢هـ)","في ١٧ رمضان خرج النبي ﷺ بنحو ٣١٣ رجلًا لاعتراض قافلة أبي سفيان فالتقى بجيش قريش قرابة ألف مقاتل، فنصر الله المسلمين وقُتل أبو جهل وعدد من صناديد قريش وأُسر سبعون، وفُدي الأسرى بالمال أو بتعليم الصبيان القراءة."],
["٢٠) غزوة أحد (٣هـ)","ثأرًا لبدر خرجت قريش بثلاثة آلاف، وجعل النبي ﷺ خمسين رامٍ على جبل الرماة وأمرهم بالثبات، فلما رأوا النصر نزل أكثرهم فالتف خالد بن الوليد على المسلمين، وجُرح النبي ﷺ واستشهد حمزة ومصعب وسبعون من الصحابة."],
["٢١) بنو النضير وبئر معونة والرجيع","أُجلي بنو النضير لنقض العهد وحاولوا قتل النبي ﷺ. وغدر بعض القبائل بالقراء في الرجيع وبئر معونة فاستشهد نحو سبعين من حفظة القرآن."],
["٢٢) غزوة الأحزاب والخندق (٥هـ)","تحالفت قريش وغطفان ويهود ونحو عشرة آلاف على المدينة، فأشار سلمان الفارسي بحفر الخندق، وحُوصر المسلمون قرابة شهر في برد وجوع، ثم أرسل الله ريحًا وجنودًا فرحل الأحزاب. وبعدها حوصر بنو قريظة لنقضهم العهد وحكم فيهم سعد بن معاذ."],
["٢٣) صلح الحديبية (٦هـ)","خرج ﷺ بنحو ألف وأربعمائة معتمرًا فمنعته قريش، وجرت بيعة الرضوان تحت الشجرة، ثم كتب الصلح مع سهيل بن عمرو على ترك الحرب عشر سنين والعودة في العام القادم، وسماه القرآن فتحًا مبينًا لأنه فتح باب الدعوة، فدخل الناس في الإسلام أفواجًا."],
["٢٤) خيبر والرسائل إلى الملوك (٧هـ)","فتح خيبر وأقر اليهود فيها بالمزارعة، وأرسل كتبًا إلى هرقل وكسرى والمقوقس والنجاشي يدعوهم للإسلام، وأهدى المقوقس مارية القبطية التي أنجبت إبراهيم، وأدى عمرة القضاء."],
["٢٥) غزوة مؤتة (٨هـ)","قتل الغساسنة رسول النبي ﷺ فبعث ثلاثة آلاف بقيادة زيد بن حارثة ثم جعفر ثم عبد الله بن رواحة فاستشهدوا تباعًا، فأخذ الراية خالد بن الوليد وانحاز بالجيش بحكمة وسماه النبي سيف الله."],
["٢٦) فتح مكة (٨هـ)","بعد نقض قريش للصلح بمساعدة حلفائهم على خزاعة، سار النبي ﷺ في عشرة آلاف ودخل مكة من غير قتال يُذكر، وطاف بالكعبة وحطم الأصنام وقال لقريش: «اذهبوا فأنتم الطلقاء»، وأسلم أبو سفيان وعكرمة وصفوان."],
["٢٧) حنين والطائف (٨هـ)","اجتمعت هوازن وثقيف لقتال المسلمين، فكاد جيش المسلمين الكثير ينهزم بسبب الإعجاب بالكثرة ثم ثبت النبي ﷺ ونزل النصر. وحوصرت الطائف ثم رُفع الحصار، وأسلمت ثقيف بعد عام، ووزّع النبي الغنائم وتألف قلوب حديثي الإسلام."],
["٢٨) غزوة تبوك (٩هـ)","خرج النبي ﷺ في جيش العسرة نحو ثلاثين ألفًا لمواجهة الروم في حر الصيف، وأنفق عثمان نفقة عظيمة، وتخلف ثلاثة صادقون هم كعب بن مالك ومرارة بن الربيع وهلال بن أمية فتاب الله عليهم بعد خمسين ليلة، وسُمّي العام التالي عام الوفود."],
["٢٩) حجة الوداع (١٠هـ)","حج ﷺ بنحو مئة ألف وعلّم الناس المناسك، وخطب في عرفة خطبة جامعة في حرمة الدماء والأموال وحقوق النساء وأوصى بكتاب الله، ونزل قوله تعالى: «اليوم أكملت لكم دينكم»."],
["٣٠) مرض النبي ووفاته (١١هـ)","اشتد به المرض في بيت عائشة، وأمر أبا بكر أن يصلي بالناس، وجهّز جيش أسامة، وتوفي ﷺ يوم الاثنين ١٢ ربيع الأول سنة ١١هـ وله ثلاث وستون سنة، ودُفن في حجرة عائشة، وقال أبو بكر: «من كان يعبد محمدًا فإن محمدًا قد مات ومن كان يعبد الله فإن الله حي لا يموت»."],
["٣١) من شمائله وأخلاقه","كان أحسن الناس خلقًا، يخصف نعله ويخيط ثوبه ويخدم أهله، لا يرد سائلًا، رحيمًا بالأطفال والنساء والحيوان، يبتسم كثيرًا، ويصوم ويقوم حتى تتفطر قدماه، ويدعو لمن آذاه. وصفته عائشة بقولها: «كان خلقه القرآن»."],
["٣٢) أزواجه أمهات المؤمنين","خديجة، سودة، عائشة، حفصة، زينب بنت خزيمة، أم سلمة، زينب بنت جحش، جويرية، أم حبيبة، صفية، ميمونة، ومارية سريته أم إبراهيم رضي الله عنهن، وفي كل زواج حكمة من تشريع أو ربط قبائل أو رعاية أرملة."]];
XC.sahaba=[
["أبو بكر الصديق (ت ١٣هـ)","عبد الله بن عثمان التيمي، أول الرجال إسلامًا، صاحب النبي في الغار والهجرة، أنفق ماله كله في سبيل الله وأعتق المستضعفين. ثبّت الأمة يوم وفاة النبي، وأنفذ جيش أسامة، وحارب المرتدين ومانعي الزكاة، وأمر بجمع القرآن بعد معركة اليمامة. حكم سنتين وأشهرًا."],
["عمر بن الخطاب (ت ٢٣هـ)","أسلم في السنة السادسة، لُقّب بالفاروق. في خلافته فُتحت العراق والشام ومصر وفارس والقدس، ووضع الدواوين والتاريخ الهجري، واشتهر بعدله وزهده وتفقده للرعية. استُشهد على يد أبي لؤلؤة المجوسي وهو يصلي الفجر."],
["عثمان بن عفان (ت ٣٥هـ)","ذو النورين تزوج ابنتي النبي رقية ثم أم كلثوم، جهّز جيش العسرة واشترى بئر رومة. جمع الناس على مصحف واحد وبعث بنسخه إلى الأمصار، وتوسعت الفتوح وأُنشئ أول أسطول إسلامي. حوصر في داره واستُشهد وهو يقرأ القرآن."],
["علي بن أبي طالب (ت ٤٠هـ)","ابن عم النبي وزوج فاطمة، أول من أسلم من الصبيان، نام في فراش النبي ليلة الهجرة، وكان من أشجع الصحابة وأعلمهم بالقضاء. تولى الخلافة بعد عثمان واضطربت الفتنة فكانت وقعتا الجمل وصفين، واستُشهد على يد ابن ملجم الخارجي."],
["خديجة بنت خويلد","أول من آمن بالنبي، ثبّتته في أول الوحي ببذل مالها وجاهها، وتوفيت قبل الهجرة بثلاث سنين، وبشّرها النبي ببيت في الجنة، وكان يذكرها ويُكرم صديقاتها بعد وفاتها."],
["عائشة بنت أبي بكر (ت ٥٨هـ)","تزوجها النبي بعد خديجة وكانت أحب نسائه إليه، وروت أكثر من ألفين ومئتي حديث، وكانت من أفقه الصحابة، يرجع إليها كبار الصحابة والتابعين في العلم، ونزلت براءتها في سورة النور."],
["فاطمة الزهراء (ت ١١هـ)","ابنة النبي ﷺ وسيدة نساء أهل الجنة، زوجة علي وأم الحسن والحسين، توفيت بعد النبي بنحو ستة أشهر، وكان يقول عنها: «فاطمة بضعة مني»."],
["بلال بن رباح (ت ٢٠هـ)","حبشي عُذّب في مكة بوضع الصخرة على صدره وهو يقول «أحدٌ أحدٌ»، فاشتراه أبو بكر وأعتقه، وكان أول مؤذن في الإسلام، وأذّن يوم فتح مكة على الكعبة، وتوفي بالشام."],
["خالد بن الوليد (ت ٢١هـ)","أسلم قبل فتح مكة، لقبه النبي سيف الله، خاض عشرات المعارك لم يُهزم في واحدة، وقاد حروب الردة والعراق ثم اليرموك والشام، وتوفي على فراشه بحمص متحسرًا أنه لم يمت شهيدًا."],
["أبو عبيدة بن الجراح (ت ١٨هـ)","أمين هذه الأمة، أحد العشرة المبشرين بالجنة، قاد فتح الشام بعد خالد، وتوفي في طاعون عمواس وقد رفض الخروج منه وقال: لا أفارق جندي."],
["سعد بن أبي وقاص (ت ٥٥هـ)","أحد العشرة المبشرين، أول من رمى بسهم في سبيل الله، مستجاب الدعوة، قائد معركة القادسية وفتح المدائن، وبنى الكوفة."],
["مصعب بن عمير (ت ٣هـ)","شاب مترف في مكة ترك النعيم لما أسلم، سفير النبي إلى المدينة نشر الإسلام فيها قبل الهجرة، واستُشهد يوم أحد وكُفّن في بردة قصيرة."],
["أبو هريرة (ت ٥٩هـ)","أسلم عام خيبر ولازم النبي ﷺ، وهو أكثر الصحابة رواية للحديث بنحو ٥٣٧٤ حديثًا، دعا له النبي بحفظ العلم، وولي إمرة المدينة."],
["عبد الله بن مسعود (ت ٣٢هـ)","من السابقين، كان راعي غنم أول أمره، وهو من أعلم الصحابة بالقرآن، أخذ من فم النبي ﷺ بضعًا وسبعين سورة، وأرسله عمر معلمًا إلى الكوفة."],
["أنس بن مالك (ت ٩٣هـ)","خادم النبي عشر سنين، دعا له النبي بكثرة المال والولد وطول العمر، وروى أكثر من ألفين ومئتي حديث وعاش حتى قرابة المئة."],
["عبد الله بن عباس (ت ٦٨هـ)","حبر الأمة وترجمان القرآن، دعا له النبي بالفقه في الدين وعلم التأويل، ابن عم النبي ﷺ، وكان مجلسه للتفسير والفقه والشعر."],
["زيد بن ثابت (ت ٤٥هـ)","كاتب الوحي، كلفه أبو بكر بجمع القرآن وعثمان بنسخ المصاحف، وأعلم الصحابة بالفرائض والمواريث."],
["الزبير وطلحة وعبد الرحمن بن عوف","من العشرة المبشرين بالجنة: الزبير حواري النبي، وطلحة وقى النبي بيده يوم أحد، وعبد الرحمن بن عوف من أغنياء الصحابة وأكثرهم إنفاقًا ومن أهل الشورى."]];
XC.imams=[
["الإمام أبو حنيفة النعمان (٨٠–١٥٠هـ) — النشأة","وُلد بالكوفة وكان تاجر قماش، وتوجه لطلب العلم بعد أن لفته أحد العلماء، فلازم حماد بن أبي سليمان قرابة ثمانية عشر عامًا، وأخذ عن عطاء بن أبي رباح وغيره."],
["أبو حنيفة — منهجه وتلاميذه","اشتهر بالفقه والرأي والقياس والاستحسان، وكان يجتهد في وضع المسائل وفتحها، وأخذ عنه أبو يوسف ومحمد بن الحسن وزفر، فنشروا مذهبه، وأُلف المذهب في الفقه الحنفي المنتشر في تركيا والهند وآسيا الوسطى والعراق والشام."],
["أبو حنيفة — المحنة والوفاة","عُرض عليه القضاء من العباسيين فامتنع فسُجن وجُلد، وتوفي في بغداد سنة ١٥٠هـ، وصلى عليه خلق كثير. ومن كتبه المنسوبة إليه الفقه الأكبر."],
["الإمام مالك بن أنس (٩٣–١٧٩هـ) — النشأة","وُلد بالمدينة في أسرة علم، حفظ القرآن وطلب العلم صغيرًا، وأخذ عن نافع مولى ابن عمر وابن شهاب الزهري وربيعة الرأي، وجلس للتدريس وهو في نحو العشرين، وكان إمام دار الهجرة."],
["مالك — الموطأ والمنهج","ألّف الموطأ وهو من أوائل كتب الحديث والفقه، واعتمد في مذهبه على الكتاب والسنة وعمل أهل المدينة والإجماع والقياس والمصالح المرسلة. أخذ عنه الشافعي ومحمد بن الحسن وغيرهما."],
["مالك — خلقه ومحنته","كان شديد التعظيم للحديث، لا يحدث إلا على طهارة وهيبة، ورفض أن يحمل الناس على الموطأ، وضُرب في عهد المنصور أو جعفر في مسألة طلاق المكره، فازداد مكانة، وتوفي سنة ١٧٩هـ ودُفن بالبقيع. ينتشر مذهبه في المغرب العربي والسودان وغرب أفريقيا."],
["الإمام الشافعي (١٥٠–٢٠٤هـ) — النشأة","وُلد بغزة وقيل بعسقلان، ونشأ يتيمًا في مكة، حفظ القرآن وهو ابن سبع والموطأ وهو ابن عشر، ولزم مسلم بن خالد الزنجي، ثم رحل إلى المدينة وأخذ عن مالك، ثم اليمن والعراق."],
["الشافعي — المذهبان القديم والجديد","وضع أصول الفقه في كتابه الرسالة، وله مذهب قديم في العراق ومذهب جديد في مصر بعد قدومه إليها سنة ١٩٩هـ، ومن كتبه الأم، وتلاميذه في مصر الربيع المرادي والمزني والبويطي."],
["الشافعي — الوفاة","توفي بمصر في رجب سنة ٢٠٤هـ ودُفن بالقرافة. ينتشر مذهبه في مصر والشام والحجاز وإندونيسيا وماليزيا وشرق أفريقيا."],
["الإمام أحمد بن حنبل (١٦٤–٢٤١هـ) — النشأة","وُلد ببغداد ونشأ يتيمًا، وطلب الحديث وسافر لجمعه إلى الكوفة والبصرة والحجاز واليمن والشام، ولزم الشافعي ببغداد، وكان من أحفظ الناس للحديث."],
["أحمد — المسند والمذهب","جمع المسند وفيه نحو ثلاثين ألف حديث، وكان مذهبه قائمًا على النص والآثار، فيقدم الحديث على الرأي، وانتشر مذهبه بتلاميذه كابنه عبد الله وأبي داود والأثرم، وهو اليوم مذهب في الجزيرة العربية وقطر."],
["أحمد — المحنة","ثبت في فتنة القول بخلق القرآن زمن المأمون والمعتصم فسُجن وضُرب، ولم يتراجع حتى زالت المحنة زمن المتوكل، وتوفي ببغداد سنة ٢٤١هـ وحضر جنازته مئات الآلاف."]];

const HAJJ=[
["أولًا: الفرق بين الحج والعمرة","الحج فرض عين مرة في العمر على المسلم البالغ العاقل المستطيع ماليًا وبدنيًا وأمن الطريق، وتزيد المرأة بوجود محرم أو من تأمن معه عند بعض الفقهاء. العمرة سنة مؤكدة عند الجمهور، وواجبة عند الحنابلة والشافعية في قول، ولها ميقات وإحرام وطواف وسعي وحلق أو تقصير، ولا وقوف بعرفة فيها."],
["ثانيًا: المواقيت المكانية","ذو الحليفة (أبيار علي) لأهل المدينة، الجحفة (ورابغ بدلها) لأهل الشام ومصر والمغرب، يلملم لأهل اليمن، قرن المنازل (السيل الكبير) لأهل نجد، ذات عرق لأهل العراق. ومن كان في الجو يحرم إذا حاذى الميقات. والمواقيت الزمانية للحج: شوال وذو القعدة وعشر من ذي الحجة."],
["ثالثًا: الإحرام","يستحب الاغتسال وقص الشارب والأظافر وتنظيف الجسد وتطيب البدن قبل النية. يلبس الرجل إزارًا ورداءً أبيضين نظيفين وتلبس المرأة ما شاءت من الثياب الساترة بلا نقاب ولا قفازين. ثم ينوي بقلبه ويقول: لبيك عمرة، أو لبيك حجًا، ويشترط إن خاف المانع: «فإن حبسني حابس فمحلي حيث حبستني»."],
["رابعًا: التلبية","«لبيك اللهم لبيك، لبيك لا شريك لك لبيك، إن الحمد والنعمة لك والملك، لا شريك لك». يجهر بها الرجل وتخفضها المرأة، ويكثر منها حتى يبدأ بالطواف في العمرة، وحتى يرمي جمرة العقبة في الحج."],
["خامسًا: محظورات الإحرام","حلق الشعر وقص الأظافر، وتغطية الرأس للرجل، ولبس المخيط على البدن، والطيب، وعقد النكاح، والجماع ومقدماته، وقتل صيد البر، وتغطية الوجه للمرأة بالنقاب. فمن فعل شيئًا منها لزمه فدية: صيام ثلاثة أيام أو إطعام ستة مساكين أو ذبح شاة، وأما الجماع قبل التحلل الأول ففيه بدنة ويفسد الحج."],
["سادسًا: العمرة خطوة بخطوة","١) الإحرام من الميقات. ٢) دخول المسجد الحرام بالرجل اليمنى والدعاء. ٣) الطواف سبعة أشواط من الحجر الأسود وبالكعبة عن اليسار، ويضطبع الرجل ويرمل في الثلاثة الأولى في طواف القدوم. ٤) ركعتان خلف المقام. ٥) شرب ماء زمزم. ٦) السعي سبعة أشواط من الصفا إلى المروة. ٧) الحلق أو التقصير، والحلق أفضل للرجل."],
["سابعًا: تفاصيل الطواف","يشترط الطهارة وستر العورة وجعل الكعبة عن اليسار وإكمال سبعة أشواط داخل المسجد، ويبدأ كل شوط من الحجر الأسود، ويستلم الركن اليماني ويقول بينه وبين الحجر: «ربنا آتنا في الدنيا حسنة وفي الآخرة حسنة وقنا عذاب النار». ومن عجز عن التقبيل يشير بيده. والحِجر من الكعبة فلا يدخل فيه الطائف."],
["ثامنًا: تفاصيل السعي","يبدأ من الصفا ويقرأ «إن الصفا والمروة من شعائر الله» ثم يستقبل الكعبة ويكبر ويدعو، ويسرع الرجل بين العلمين الأخضرين، والذهاب من الصفا إلى المروة شوط والعودة شوط آخر، فينتهي بالمروة في السابع. ولا يشترط له الطهارة لكنها أفضل."],
["تاسعًا: أيام الحج (التمتع)","يوم التروية ٨ ذو الحجة: الإحرام بالحج من مكان الإقامة والذهاب إلى منى وصلاة الظهر والعصر والمغرب والعشاء والفجر قصرًا بلا جمع. يوم عرفة ٩: الوقوف بعرفة بعد الزوال إلى الغروب والجمع والقصر للظهر والعصر والإكثار من الدعاء، ثم الدفع إلى مزدلفة بعد الغروب والمبيت بها وجمع المغرب والعشاء."],
["عاشرًا: أيام النحر والتشريق","يوم النحر ١٠: رمي جمرة العقبة بسبع حصيات بعد الفجر أو بعد منتصف الليل للمعذور، ثم الذبح ثم الحلق أو التقصير (التحلل الأول)، ثم طواف الإفاضة والسعي للمتمتع (التحلل الثاني). أيام التشريق ١١-١٢-١٣: المبيت بمنى ورمي الجمرات الثلاث بعد الزوال بسبع حصيات لكل جمرة مبتدئًا بالصغرى فالوسطى فالكبرى. من تعجل خرج قبل غروب ١٢، ومن تأخر بقي إلى ١٣ وهو أفضل."],
["أركان الحج","الإحرام، والوقوف بعرفة، وطواف الإفاضة، والسعي بين الصفا والمروة. وتختلف المذاهب في عدّ بعضها، فالحنفية لا يعدون السعي ركنًا بل واجبًا، ومن ترك ركنًا لم يتم حجه."],
["واجبات الحج","الإحرام من الميقات، والوقوف بعرفة إلى الغروب، والمبيت بمزدلفة، ورمي الجمار، والحلق أو التقصير، والمبيت بمنى ليالي التشريق، وطواف الوداع. وتركها يوجب دمًا (ذبح شاة)."],
["أركان العمرة وواجباتها","أركانها: الإحرام، والطواف، والسعي. وواجباتها: الإحرام من الميقات، والحلق أو التقصير. وسننها: الاغتسال والتلبية والاضطباع والرمل وركعتا الطواف."],
["أنواع النسك","التمتع: عمرة ثم الإحلال ثم حج في العام نفسه وفيه هدي. الإفراد: حج فقط بلا هدي. القران: عمرة وحج بنية واحدة ويسوق الهدي. والتمتع أفضل عند الجمهور لمن لم يسق الهدي."],
["الهدي والفدية","الهدي شاة أو سُبع بدنة أو بقرة للمتمتع والقارن، فمن لم يجد صام ثلاثة أيام في الحج وسبعة إذا رجع. ويُوزّع على الفقراء ويجوز الأكل منه."],
["أخطاء شائعة","الخروج من عرفة قبل الغروب، والتحرج في رمي الجمار قبل الزوال أيام التشريق، وتخصيص أدعية معينة لكل شوط وليس بلازم، ومزاحمة الحجر الأسود وإيذاء الناس، وتغطية المحرم رأسه، والذهاب إلى جبل الرحمة للتبرك، وتقبيل أو مسح جدران الكعبة والمقام."],
["زيارة المدينة","زيارة المسجد النبوي ليست من الحج لكنها مستحبة، يُشد الرحل إلى المسجد لا إلى القبر، والصلاة فيه بألف صلاة، ويسلّم على النبي ﷺ وصاحبيه بأدب ويصلي في الروضة ويزور البقيع وأحد وقباء."],
["ملحوظة","هذا تلخيص علمي عام، وتتفاوت التفاصيل بين المذاهب، فاسأل عالمًا موثوقًا أو بعثتك قبل السفر، وعند الشك في أمر في النسك اتبع إرشادات الجهة الرسمية المنظمة للحج."]];
