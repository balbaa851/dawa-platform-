<style>
/* Layout: persistent sidebar (desktop) / bottom tab bar (phone); one 640px content column of cards. */
:root{
  --bg:#F9FAFB; --surface:#FFFFFF; --surface-2:#EEF3F1; --fg:#0E1E1B; --muted:#586966; --line:#DFE7E5;
  --primary:#059669; --primary-strong:#047857; --on-primary:#FFFFFF; --teal:#0F766E;
  --gold:#D4AF37; --gold-ink:#86690A; --danger:#B42318; --tint:rgba(5,150,105,.10); --warn-bg:#FBF3D5;
  --font-body:'Figtree',system-ui,sans-serif; --font-ar:'Noto Naskh Arabic','Amiri',serif;
  --font-quran:'Amiri','Noto Naskh Arabic',serif; --font-display:'Reem Kufi','Figtree',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1120; --surface:#111A2E; --surface-2:#16213A; --fg:#E7ECF3; --muted:#93A1B5; --line:#1F2B45;
    --primary:#10B981; --gold-ink:#D4AF37; --danger:#F97066; --tint:rgba(16,185,129,.14); --warn-bg:#2B2510; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1120; --surface:#111A2E; --surface-2:#16213A; --fg:#E7ECF3; --muted:#93A1B5; --line:#1F2B45;
  --primary:#10B981; --gold-ink:#D4AF37; --danger:#F97066; --tint:rgba(16,185,129,.14); --warn-bg:#2B2510; color-scheme:dark;
}
:root[data-skin="emerald"]{
  --bg:#04241C; --surface:#073B2E; --surface-2:#0A4A39; --fg:#ECFDF5; --muted:#8FD9BF; --line:#0F5C46;
  --primary:#34D399; --gold-ink:#E6C55A; --danger:#FDA29B; --tint:rgba(52,211,153,.16); --warn-bg:#173F2E; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;transition:background-color .3s,color .3s}
[dir="rtl"] body,[dir="rtl"] button,[dir="rtl"] input,[dir="rtl"] textarea,[dir="rtl"] select{font-family:var(--font-ar)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:var(--primary);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
.shell{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow-y:auto;padding:18px 14px 18px 0;display:flex;flex-direction:column;gap:2px}
[dir="rtl"] .side{padding:18px 0 18px 14px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--fg);margin-bottom:14px}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--primary-strong);color:var(--gold);display:grid;place-items:center;font-style:normal;font-size:18px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--fg);font-weight:500}
.nav a:hover{background:var(--tint)}
.nav a[aria-current="page"]{background:var(--tint);color:var(--primary);font-weight:700}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.col{min-width:0;border-inline:1px solid var(--line);min-height:100vh}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.top .logo{margin:0;font-size:18px;display:none}
.date{font-size:13px;color:var(--muted);flex:1;min-width:0}
.date b{color:var(--fg);font-weight:600}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:36px;min-width:36px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-weight:600;font-size:13px}
.iconbtn:hover{border-color:var(--primary)}
main{padding:20px 16px 40px;display:flex;flex-direction:column;gap:14px;max-width:680px;margin:0 auto}
.ph h1{font-size:26px;font-weight:700}
.ph p{margin:4px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card.flat{background:var(--surface-2);border-color:transparent}
.btn{border:0;border-radius:999px;padding:9px 18px;background:var(--primary-strong);color:var(--on-primary);font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#1A1500}
.btn.sm{padding:5px 12px;font-size:13px}
input[type=text],input[type=search],textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 14px}
textarea{resize:vertical;min-height:76px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.sm{font-size:13px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"],.chip:hover{background:var(--tint);border-color:var(--primary);color:var(--primary)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.notice{background:var(--warn-bg);border-radius:12px;padding:10px 14px;font-size:13px}
.av{width:40px;height:40px;border-radius:50%;background:var(--tint);color:var(--primary);display:grid;place-items:center;font-weight:700;flex:none}
.post .body{margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.post .alt{background:var(--tint);border-radius:10px;padding:10px 12px;margin:0 0 10px}
.acts{display:flex;gap:2px;flex-wrap:wrap;margin-inline:-8px}
.act{border:0;background:transparent;border-radius:999px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer;font-weight:600;font-size:13px}
.act:hover{background:var(--tint);color:var(--primary)}
.act[aria-pressed="true"]{color:var(--primary)}
.act.dn .ic{transform:scaleY(-1)}
.act.push{margin-inline-start:auto}
.ar{font-family:var(--font-quran);direction:rtl;line-height:2.1}
.ayah{font-size:28px}
.blank{border:0;border-bottom:2px dashed var(--gold);background:var(--tint);border-radius:6px;min-width:3.2ch;height:1.4em;vertical-align:middle;cursor:pointer;color:transparent;margin:0 4px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item{text-align:start;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%}
.item:hover{border-color:var(--primary)}
.num{display:inline-block;min-width:2.2em;color:var(--muted);font-variant-numeric:tabular-nums}
.times{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.time{text-align:center;padding:12px 6px}
.time b{display:block;font-size:22px;font-variant-numeric:tabular-nums;color:var(--primary)}
.time.next{border-color:var(--gold);background:var(--surface-2)}
.time.next b{color:var(--gold-ink)}
.compass{width:min(220px,100%);aspect-ratio:1;margin:0 auto;display:block}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);transition:width .25s}
.bubble{max-width:80%;padding:8px 14px;border-radius:16px;overflow-wrap:anywhere}
.bubble.me{background:var(--primary-strong);color:var(--on-primary);margin-inline-start:auto;border-end-end-radius:4px}
.bubble.them{background:var(--surface-2);border-end-start-radius:4px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:none;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 10px;border-radius:10px}
.tabs a[aria-current="page"]{color:var(--primary)}
.more{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.more a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;text-align:center;font-weight:600;color:var(--fg)}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .col{border-inline:0}
  .top .logo{display:flex}
  .tabs{display:flex}
  main{padding-bottom:96px}
  .grid2{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ---------- prayer maths (offline, standard solar algorithm) ---------- */
const rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI,sn=d=>Math.sin(rad(d)),cs=d=>Math.cos(rad(d)),tn=d=>Math.tan(rad(d));
const fix=(a,b)=>{a=a-b*Math.floor(a/b);return a<0?a+b:a};
function julian(y,m,d){if(m<=2){y-=1;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sunPos(jd){const D=jd-2451545,g=fix(357.529+.98560028*D,360),q=fix(280.459+.98564736*D,360),Ls=fix(q+1.915*sn(g)+.02*sn(2*g),360),e=23.439-3.6e-7*D;const RA=fix(deg(Math.atan2(cs(e)*sn(Ls),cs(Ls)))/15,24);return{dec:deg(Math.asin(sn(e)*sn(Ls))),eq:q/15-RA}}
function prayerTimes(y,m,d,lat,lng,M){
  const jd=julian(y,m,d)-lng/360;
  const mid=x=>fix(12-sunPos(jd+x).eq,24);
  const ang=(a,x,ccw)=>{const dec=sunPos(jd+x).dec,v=(-sn(a)-sn(dec)*sn(lat))/(cs(dec)*cs(lat));if(v<-1||v>1)return NaN;return mid(x)+(ccw?-1:1)*deg(Math.acos(v))/15};
  const asr=x=>{const dec=sunPos(jd+x).dec;return ang(-deg(Math.atan(1/(1+tn(Math.abs(lat-dec))))),x)};
  let p={fajr:5/24,sunrise:6/24,dhuhr:.5,asr:13/24,maghrib:18/24,isha:18/24};
  for(let i=0;i<2;i++){p={fajr:ang(M.f,p.fajr,true),sunrise:ang(.833,p.sunrise,true),dhuhr:mid(p.dhuhr)+1/60,asr:asr(p.asr),maghrib:ang(.833,p.maghrib),isha:M.im?0:ang(M.i,p.isha)}}
  if(M.im)p.isha=p.maghrib+M.im/60;
  const base=Date.UTC(y,m-1,d),o={};
  for(const k in p)o[k]=new Date(base+(p[k]-lng/15)*36e5);
  return o}
function qibla(lat,lng){const a=rad(lat),b=rad(21.4225),dl=rad(39.8262-lng);return fix(deg(Math.atan2(Math.sin(dl),Math.cos(a)*Math.tan(b)-Math.sin(a)*Math.cos(dl))),360)}
function ymdIn(tz,date){const p=new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(date);const g=k=>+p.find(x=>x.type===k).value;return[g("year"),g("month"),g("day")]}

const LOAD={};
function loadSurah(n){
  if(TEXT[n]||LOAD[n]==="loading")return;
  const c=store.get("q"+n,null);if(c){TEXT[n]=c;return}
  LOAD[n]="loading";
  fetch("https://api.alquran.cloud/v1/surah/"+n+"/editions/quran-uthmani,en.sahih").then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{
    const ar=j.data[0].ayahs.map(a=>a.text),en=j.data[1].ayahs.map(a=>a.text);
    const norm=x=>x.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g,"").replace(/\u0671/g,"\u0627");
    if(n!==1&&n!==9&&norm(ar[0]).indexOf("\u0628\u0633\u0645 \u0627\u0644\u0644\u0647 \u0627\u0644\u0631\u062D\u0645\u0646 \u0627\u0644\u0631\u062D\u064A\u0645")===0){const w=ar[0].split(" ");if(w.length>4)ar[0]=w.slice(4).join(" ")}
    TEXT[n]={ar:ar,en:en,live:true};store.set("q"+n,TEXT[n]);LOAD[n]="ok";
  }).catch(()=>{LOAD[n]="err"}).then(()=>{if(S.surah===n&&(location.hash.slice(1)||"more")==="quran")render()});
}

  else body=d.ar.map((a,i)=>{
    let html;
    if(S.hifz){html=a.split(" ").map((w,j)=>((j+i)%3===1&&!S.revealed[`h${n}-${i}-${j}`])?`<button class="blank" data-act="reveal" data-k="h${n}-${i}-${j}" aria-label="Hidden word">${"ـ".repeat(Math.max(2,Math.min(w.length,6)))}</button>`:esc(w)).join(" ")}
    else html=esc(a);
    return `<div class="card"><div class="ar ayah">${html} <span class="muted" style="font-size:18px">﴿${i+1}﴾</span></div>${S.hifz?"":`<p class="muted" style="margin:6px 0 0" dir="ltr">${esc(d.en[i])}</p>`}</div>`}).join("");
  return `<button class="chip" data-act="back" style="align-self:flex-start">← ${esc(t("quran"))}</button><div class="ph"><h1 class="ar" style="font-size:38px;color:var(--gold-ink);text-align:center">${esc(AR[n-1])}</h1><p style="text-align:center">${esc(EN[n-1])}</p></div>
   ${audioHTML(n)}${d?`<div class="row"><button class="chip" data-act="hifz" aria-pressed="${S.hifz}">${esc(L("Hifz test: hide words","اختبار الحفظ: إخفاء كلمات"))}</button>${S.hifz?`<button class="chip" data-act="hifzreset">${esc(L("Reset","إعادة"))}</button>`:""}</div>`:""}${body}${d?`<p class="muted sm">${esc(d.live?L("English: Saheeh International translation, loaded from alquran.cloud.","الإنجليزية: ترجمة صحيح إنترناشيونال من alquran.cloud."):L("English lines are short paraphrases of the meaning, not an official translation.","المعاني المعروضة تفسير مختصر وليست ترجمة معتمدة."))}</p>`:""}`};

V.qaris=()=>{const f=S.qf||"all";const l=QARIS.filter(x=>f==="all"||x[2]===f||x[2]==="both");
  return head(t("qaris"),t("qarisSub"))+`<div class="notice">${esc(L("Directory of 20 reciters. To listen, open any surah on the Quran page and choose Mishary Alafasy, Abdul Basit or Saud Ash-Shuraim.","دليل لـ20 قارئًا. للاستماع افتح أي سورة في صفحة القرآن واختر مشاري العفاسي أو عبد الباسط أو سعود الشريم."))}</div>
  <div class="row">${[["all",L("All","الكل")],["murattal",L("Murattal","مرتّل")],["mujawwad",L("Mujawwad","مجوّد")]].map(([k,v])=>`<button class="chip" data-act="qf" data-s="${k}" aria-pressed="${f===k}">${esc(v)}</button>`).join("")}</div>
  <div class="grid2">${l.map(x=>`<div class="card"><b>${esc(x[0])}</b><div class="ar" style="font-size:20px;line-height:1.6">${esc(x[1])}</div><span class="tag">${x[2]==="both"?"Murattal · Mujawwad":x[2]}</span></div>`).join("")}</div>`};

V.hadith=()=>head(t("hadith"),t("hadithSub"))+HADITH.map(h=>`<article class="card"><div class="ar" style="font-size:24px">${esc(h.ar)}</div><p style="margin:6px 0">${esc(h.en)}</p><div class="row sb"><span class="muted sm">${esc(h.src)}</span><span class="tag">${esc(h.topic)}</span></div></article>`).join("")+`<p class="muted sm">${esc(L("English lines are paraphrases. Check the cited collection for the exact wording and grading.","الإنجليزية بتصرّف. راجع المصدر المذكور للنص الدقيق والدرجة."))}</p>`;

V.prayer=()=>{
  const c=CITIES[S.city]||CITIES.Cairo,M=METHODS[S.method]||METHODS.egypt;
  return head(t("prayer"),t("prayerSub"))+`<div class="row"><select id="city" aria-label="City" style="width:auto;flex:1">${Object.keys(CITIES).map(k=>`<option ${k===S.city?"selected":""}>${esc(k)}</option>`).join("")}</select><select id="method" aria-label="Method" style="width:auto;flex:1">${Object.entries(METHODS).map(([k,v])=>`<option value="${k}" ${k===S.method?"selected":""}>${esc(v.n)}</option>`).join("")}</select></div>
  <div class="card flat row sb"><span class="muted">${esc(L("Next prayer","الصلاة القادمة"))}: <b id="nextName" style="color:var(--fg)"></b></span><b id="countdown" style="font-size:24px;font-variant-numeric:tabular-nums"></b></div>
  <div class="times" id="times"></div>
  <div class="card" id="qcard" style="text-align:center"><h2 style="font-size:18px;margin-bottom:10px">${esc(L("Qibla direction","اتجاه القبلة"))}</h2>
   <svg class="compass" viewBox="0 0 200 200" role="img" aria-label="Qibla compass"><circle cx="100" cy="100" r="92" fill="var(--surface-2)" stroke="var(--primary)" stroke-width="3"/>
    <g id="qdial" style="transition:transform .12s linear">${[["N",100,64],["E",144,105],["S",100,152],["W",56,105]].map(([l,x,y])=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--muted)">${l}</text>`).join("")}
     <g id="qk" transform="rotate(0 100 100)"><path d="M100 100 L100 44" stroke="var(--gold)" stroke-width="2" stroke-dasharray="4 3"/><text x="100" y="36" text-anchor="middle" font-size="20">🕋</text></g></g>
    <path d="M100 4 L109 20 L91 20 Z" fill="var(--primary-strong)"/><circle cx="100" cy="100" r="6" fill="var(--primary-strong)"/></svg>
   <p class="muted sm" id="qinfo" style="margin:8px 0"></p>
   <button class="btn" data-act="qstart">${esc(L("Start live compass","تشغيل البوصلة المباشرة"))}</button>
   <p class="muted sm" id="qmsg" style="margin:8px 0 0">${esc(L("Hold your phone flat. Allow location and motion when asked.","أمسك الهاتف أفقيًا واسمح بالموقع والحركة عند الطلب."))}</p></div>
  <p class="muted sm">${esc(L("Times are calculated with the "+M.n+" method (Asr: standard). They can differ by a few minutes from your local mosque, so follow the official timetable where you live.","الأوقات محسوبة بطريقة «"+M.n+"» (العصر: المذهب الجمهور). قد تختلف دقائق عن مسجدك، فاتبع الجدول الرسمي في بلدك."))}</p>`};
const LQ={h:null,pos:null,on:false,got:false,al:false,to:0,wid:null};
const qEvt=()=>("ondeviceorientationabsolute" in window)?"deviceorientationabsolute":"deviceorientation";
function qBearing(){const c=CITIES[S.city]||CITIES.Cairo;return LQ.pos?qibla(LQ.pos[0],LQ.pos[1]):qibla(c[0],c[1])}
function qdraw(){
  const d=$("#qdial");if(!d)return;
  const b=qBearing(),h=LQ.h,k=$("#qk"),info=$("#qinfo"),card=$("#qcard");
  k.setAttribute("transform","rotate("+b.toFixed(1)+" 100 100)");
  d.setAttribute("transform","rotate("+(h==null?0:-h).toFixed(1)+" 100 100)");
  const src=LQ.pos?L("your location","موقعك"):S.city;
  if(h==null){info.textContent=b.toFixed(1)+"° "+L("clockwise from north, using ","باتجاه عقارب الساعة من الشمال، حسب ")+src;card.style.outline="";return}
  const diff=((b-h+540)%360)-180,ok=Math.abs(diff)<=3;
  info.innerHTML=ok?"<b style=\"color:var(--primary)\">✓ "+esc(L("You are facing the Qibla","أنت تواجه القبلة"))+"</b>":esc(L("Turn ","أدِر "))+Math.abs(diff).toFixed(0)+"° "+esc(diff>0?L("right","يمينًا"):L("left","يسارًا"))+" · "+esc(L("Qibla ","القبلة "))+b.toFixed(0)+"°";
  card.style.outline=ok?"2px solid var(--primary)":"";
  if(ok&&!LQ.al&&navigator.vibrate)navigator.vibrate(60);
  LQ.al=ok;
}
function qori(e){
  let h=null;
  if(e.webkitCompassHeading!=null)h=e.webkitCompassHeading;
  else if(e.absolute===true&&e.alpha!=null){
    const a=rad(e.alpha),bt=rad(e.beta||0),g=rad(e.gamma||0);
    if(Math.abs(e.beta||0)<50)h=360-e.alpha;
    else h=deg(Math.atan2(-(Math.sin(g)*Math.cos(a)+Math.cos(g)*Math.sin(bt)*Math.sin(a)),-(Math.sin(g)*Math.sin(a)-Math.cos(g)*Math.sin(bt)*Math.cos(a))));
  }
  if(h==null||isNaN(h))return;
  h=(h+((screen.orientation&&screen.orientation.angle)||0)+720)%360;
  LQ.got=true;LQ.h=LQ.h==null?h:(LQ.h+(((h-LQ.h+540)%360)-180)*0.3+360)%360;
  qdraw();
}
function stopQibla(){
  window.removeEventListener("deviceorientationabsolute",qori,true);window.removeEventListener("deviceorientation",qori,true);
  if(LQ.wid!=null&&navigator.geolocation)navigator.geolocation.clearWatch(LQ.wid);
  clearTimeout(LQ.to);LQ.on=false;LQ.h=null;LQ.wid=null;LQ.al=false;
}
function startQibla(){
  const m=$("#qmsg"),btn=$('[data-act="qstart"]');
  if(LQ.on){stopQibla();if(btn)btn.textContent=L("Start live compass","تشغيل البوصلة المباشرة");qdraw();return}
  const go=()=>{
    LQ.on=true;LQ.got=false;window.addEventListener(qEvt(),qori,true);
    if(btn)btn.textContent=L("Stop live compass","إيقاف البوصلة");
    if(m)m.textContent=L("Live. Hold the phone flat and turn until the Kaaba reaches the top arrow.","مباشر. أمسك الهاتف أفقيًا وأدِر حتى تصل الكعبة إلى السهم العلوي.");
    LQ.to=setTimeout(()=>{if(!LQ.got&&m)m.textContent=L("No compass sensor found. Open this page on a phone over HTTPS and allow motion access.","لم يُعثر على حساس البوصلة. افتح الصفحة على هاتف عبر HTTPS واسمح بالحركة.")},2500);
  };
  if(navigator.geolocation)LQ.wid=navigator.geolocation.watchPosition(p=>{LQ.pos=[p.coords.latitude,p.coords.longitude];qdraw()},()=>{if(m&&!LQ.got)m.textContent=L("Location not allowed, so the selected city is used.","لم يُسمح بالموقع، لذلك تُستخدم المدينة المختارة.")},{maximumAge:60000,timeout:20000});
  if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){
    DeviceOrientationEvent.requestPermission().then(r=>{if(r==="granted")go();else if(m)m.textContent=L("Motion access was denied. Allow it in your browser settings.","تم رفض الوصول للحركة. اسمح به من إعدادات المتصفح.")}).catch(()=>{if(m)m.textContent=L("Could not start the compass. Open the site over HTTPS.","تعذر تشغيل البوصلة. افتح الموقع عبر HTTPS.")});
  }else go();
}
let timer=null;
function startPrayer(){
  const c=CITIES[S.city]||CITIES.Cairo,M=METHODS[S.method]||METHODS.egypt,tz=c[2];
  const fm=new Intl.DateTimeFormat("en-GB",{timeZone:tz,hour:"2-digit",minute:"2-digit",hour12:false});
  const [y,m,d]=ymdIn(tz,new Date());
  const today=prayerTimes(y,m,d,c[0],c[1],M),next=new Date(Date.UTC(y,m-1,d+1)),tom=prayerTimes(next.getUTCFullYear(),next.getUTCMonth()+1,next.getUTCDate(),c[0],c[1],M);
  const names=[["fajr",L("Fajr","الفجر")],["sunrise",L("Sunrise","الشروق")],["dhuhr",L("Dhuhr","الظهر")],["asr",L("Asr","العصر")],["maghrib",L("Maghrib","المغرب")],["isha",L("Isha","العشاء")]];
  function tick(){
    const now=Date.now();let nk=null;
    for(const [k] of names){if(k!=="sunrise"&&today[k]>now){nk=k;break}}
    const target=nk?today[nk]:tom.fajr,label=nk?names.find(n=>n[0]===nk)[1]:names[0][1];
    $("#times").innerHTML=names.map(([k,l])=>`<div class="card time ${k===nk||(!nk&&k==="fajr")?"next":""}"><span class="muted sm">${l}</span><b>${isNaN(today[k])?"--:--":fm.format(today[k])}</b></div>`).join("");
    $("#nextName").textContent=label;
    const s=Math.max(0,Math.floor((target-now)/1000)),p=n=>String(n).padStart(2,"0");
    $("#countdown").textContent=`${p(Math.floor(s/3600))}:${p(Math.floor(s%3600/60))}:${p(s%60)}`}
  tick();timer=setInterval(()=>{if($("#countdown"))tick()},1000)}

const dayKey=()=>new Date().toDateString();
V.adhkar=()=>{
  if(S.adhkar.day!==dayKey()){S.adhkar={day:dayKey(),done:{}};save()}
  const done=ADHKAR.map((a,i)=>S.adhkar.done[i]||0),total=ADHKAR.reduce((s,a)=>s+a.n,0),got=done.reduce((s,n)=>s+n,0);
  return head(t("adhkar"),t("adhkarSub"))+`<div class="card flat row sb"><span>🔥 ${esc(L("Streak","السلسلة"))}: <b>${S.streak.n}</b> ${esc(L("day(s)","يوم"))}</span><span class="muted sm">${Math.round(got/total*100)}% ${esc(L("today","اليوم"))}</span></div>`+
  ADHKAR.map((a,i)=>`<button class="card" data-act="dhikr" data-i="${i}" style="text-align:start;cursor:pointer;width:100%"><div class="ar" style="font-size:24px">${esc(a.ar)}</div><p class="muted" style="margin:4px 0 8px" dir="ltr">${esc(a.en)}</p><div class="bar"><i style="width:${done[i]/a.n*100}%"></i></div><div class="sm" style="margin-top:4px">${done[i]}/${a.n}</div></button>`).join("")+`<p class="muted sm">${esc(L("Sample set. Verify wording and counts against a trusted source such as Hisn al-Muslim.","مجموعة تجريبية. تحقّق من الألفاظ والأعداد من مصدر موثوق مثل حصن المسلم."))}</p>`};

V.messages=()=>{
  if(!S.chat)S.chat=[{me:false,t:"As-salamu alaykum! Welcome to the study circle."}];
  return head(t("messages"),t("messagesSub"))+`<div class="card" style="display:grid;gap:8px"><div class="row"><div class="av">C</div><b>circle_host</b><span class="tag">Demo contact</span></div>
   <div id="thread" style="display:grid;gap:8px;max-height:46vh;overflow:auto;padding:4px 0">${S.chat.map(m=>`<div class="bubble ${m.me?"me":"them"}" dir="auto">${esc(m.t)}</div>`).join("")}</div>
   <div class="row"><input type="text" id="msg" class="grow" style="width:auto" dir="auto" placeholder="${esc(L("Type a message…","اكتب رسالة…"))}"><button class="btn" data-act="msg">${esc(L("Send","إرسال"))}</button></div></div><p class="muted sm">${esc(L("Replies here are automated. Real-time chat, voice notes and end-to-end encryption need the backend.","الردود هنا آلية. المحادثة الفورية والرسائل الصوتية والتشفير تتطلب الخادم."))}</p>`};
V.library=()=>head(t("library"),t("librarySub"))+`<div class="notice">${esc(L("Sample catalogue. Connect it to your own articles and PDFs.","فهرس تجريبي. اربطه بمقالاتك وملفاتك."))}</div>`+LIB.map(x=>`<div class="card"><div class="row sb"><b>${esc(x[0])}</b><span class="tag">${x[2]}</span></div><p class="muted" style="margin:4px 0 0">${esc(x[1])}</p></div>`).join("");
V.events=()=>head(t("events"),t("eventsSub"))+`<div class="notice">${esc(L("Sample schedule. RSVPs are saved on this device only.","جدول تجريبي. يُحفظ تأكيد الحضور على هذا الجهاز فقط."))}</div>`+EVENTS.map((x,i)=>`<div class="card row sb"><div><b>${esc(x[0])}</b><div class="muted sm">${esc(x[1])}</div><span class="tag">${x[2]}</span></div><button class="btn sm ${S.rsvp.includes(i)?"":"ghost"}" data-act="rsvp" data-i="${i}">${S.rsvp.includes(i)?"✓ "+esc(L("Going","سأحضر")):esc(L("RSVP","تسجيل"))}</button></div>`).join("");
V.leaderboard=()=>{const me=S.posts.length*5+S.streak.n*10+Object.keys(S.react).length;const l=BOARD.concat(S.user?[[S.user+" (you)",me]]:[]).sort((a,b)=>b[1]-a[1]);
  return head(t("leaderboard"),t("boardSub"))+(l.length?"":`<div class="card flat muted">${esc(L("No scores yet. Post, count your adhkar and join in to appear here.","لا درجات بعد. انشر وأكمل أذكارك لتظهر هنا."))}</div>`)+l.map((x,i)=>`<div class="card row"><span style="width:2em;font-size:20px;text-align:center">${["🥇","🥈","🥉"][i]||i+1}</span><b class="grow">@${esc(x[0])}</b><span style="font-variant-numeric:tabular-nums;color:var(--gold-ink);font-weight:700">${x[1]}</span></div>`).join("")};

/* ---------- router ---------- */
function render(){
  const r=(location.hash.slice(1)||"more");const route=V[r]&&r!=="home"&&r!=="explore"?r:"more";
  clearInterval(timer);stopQibla();
  buildNav(route);
  $("#main").innerHTML=V[route]();
  if(route==="prayer"){startPrayer();qdraw()}
  if(route==="explore")$("#results").innerHTML=searchResults(S.q||"");
  if(route==="messages"){const th=$("#thread");if(th)th.scrollTop=th.scrollHeight}
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);

/* ---------- events ---------- */
const main=$("#main");
main.addEventListener("change",e=>{if(e.target.id==="reciter"){S.reciter=e.target.value;save();const y=window.scrollY;render();window.scrollTo(0,y)}});
main.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,card=b.closest("[data-id]"),id=card&&card.dataset.id,keep=()=>{const y=window.scrollY;render();window.scrollTo(0,y)};
  if(act==="join"){const v=$("#uname").value.trim().replace(/[^A-Za-z0-9_.]/g,"");if(v.length<3){$("#uname").setCustomValidity("");$("#uname").placeholder="3+ letters or numbers";return}S.user=v;save();keep()}
  else if(act==="post"){const v=$("#newpost").value.trim();if(!v)return;S.posts.unshift({id:"u"+Date.now(),u:S.user,at:Date.now(),body:v,likes:0,dis:0});save();keep()}
  else if(act==="like"||act==="dislike"){S.react[id]=S.react[id]===act?undefined:act;if(!S.react[id])delete S.react[id];save();keep()}
  else if(act==="save"){S.saved=S.saved.includes(id)?S.saved.filter(x=>x!==id):S.saved.concat(id);save();keep()}
  else if(act==="report"){if(!S.reported.includes(id))S.reported.push(id);save();keep()}
  else if(act==="alt"){S.revealed["alt"+id]=!S.revealed["alt"+id];save();keep()}
  else if(act==="cmt"){S.revealed["c"+id]=!S.revealed["c"+id];keep()}
  else if(act==="quick"){const i=$("#cin-"+id);if(i)i.value=b.dataset.s}
  else if(act==="send"){const i=$("#cin-"+id),v=i&&i.value.trim();if(!v)return;if(!S.user){i.value="";i.placeholder="Choose a display name on Home first";return}(S.comments[id]=S.comments[id]||[]).push({u:S.user,t:v});save();keep()}
  else if(act==="tag"){S.q=b.dataset.s;$("#q").value=S.q;$("#results").innerHTML=searchResults(S.q)}
  else if(act==="surah"||act==="opensurah"){S.surah=+b.dataset.n;S.hifz=false;if(act==="surah")render();else{location.hash="quran"}}
  else if(act==="back"){S.surah=null;render()}
  else if(act==="hifz"){S.hifz=!S.hifz;keep()}
  else if(act==="hifzreset"){for(const k in S.revealed)if(k[0]==="h")delete S.revealed[k];save();keep()}
  else if(act==="reveal"){S.revealed[b.dataset.k]=true;save();keep()}
  else if(act==="qstart"){startQibla()}
  else if(act==="qf"){S.qf=b.dataset.s;keep()}
  else if(act==="dhikr"){const i=+b.dataset.i,n=ADHKAR[i].n;S.adhkar.done[i]=Math.min((S.adhkar.done[i]||0)+1,n);
    if(ADHKAR.every((a,k)=>(S.adhkar.done[k]||0)>=a.n)&&S.streak.last!==dayKey()){const y=new Date(Date.now()-864e5).toDateString();S.streak={n:S.streak.last===y?S.streak.n+1:1,last:dayKey()}}
    save();keep()}
  else if(act==="msg"){const i=$("#msg"),v=i.value.trim();if(!v)return;S.chat.push({me:true,t:v});save();render();
    setTimeout(()=>{const g=/salam|سلام|مرحب/i.test(v);S.chat.push({me:false,t:g?"Wa alaykum assalam wa rahmatullah!":"Jazakallahu khayran for sharing."});save();if((location.hash.slice(1))==="messages")render()},900)}
  else if(act==="rsvp"){const i=+b.dataset.i;S.rsvp=S.rsvp.includes(i)?S.rsvp.filter(x=>x!==i):S.rsvp.concat(i);save();keep()}
});
main.addEventListener("input",e=>{
  if(e.target.id==="newpost"){const v=e.target.value;$("#cc").textContent=v.length;$("#tone").hidden=!HEATED.some(w=>v.toLowerCase().includes(w))}
  if(e.target.id==="q"){S.q=e.target.value;$("#results").innerHTML=searchResults(S.q)}
});
main.addEventListener("change",e=>{if(e.target.id==="city"){S.city=e.target.value;save();render()}if(e.target.id==="method"){S.method=e.target.value;save();render()}});
main.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="msg"){e.preventDefault();main.querySelector('[data-act="msg"]').click()}if(e.key==="Enter"&&e.target.id==="uname"){main.querySelector('[data-act="join"]').click()}});
$("#langBtn").addEventListener("click",()=>{S.lang=S.lang==="ar"?"en":"ar";save();applyChrome();render()});
$("#themeBtn").addEventListener("click",()=>{const o=["auto","light","dark","emerald"];S.theme=o[(o.indexOf(S.theme)+1)%o.length];save();applyChrome()});

if(window.claude&&window.claude.hot&&window.claude.hot.snapshot){try{window.claude.hot.snapshot(()=>({}))}catch(e){}}
applyChrome();render();
})();
</script>
