113:{ar:["قُلْ أَعُوذُ بِرَبِّ ٱلْفَلَقِ","مِن شَرِّ مَا خَلَقَ","وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ","وَمِن شَرِّ ٱلنَّفَّٰثَٰتِ فِى ٱلْعُقَدِ","وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ"],
 en:["Say: I seek refuge in the Lord of daybreak,","from the evil of what He created,","from the evil of darkness when it settles,","from the evil of those who blow on knots,","and from the evil of an envier when he envies."]},

{ar:"دَعْ مَا يَرِيبُكَ إِلَى مَا لَا يَرِيبُكَ",en:"Leave what makes you doubt for what does not.",src:"Jami at-Tirmidhi 2518",topic:"Wisdom"},

{ar:"ارْحَمُوا مَنْ فِي الْأَرْضِ يَرْحَمْكُمْ مَنْ فِي السَّمَاءِ",en:"Show mercy to those on earth and the One in heaven will show mercy to you.",src:"Sunan Abi Dawud 4941, Jami at-Tirmidhi 1924",topic:"Mercy"},
{ar:"الْكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ",en:"A good word is charity.",src:"Sahih al-Bukhari 2989, Sahih Muslim 1009",topic:"Charity"},

{ar:"أَحَبُّ الْأَعْمَالِ إِلَى اللَّهِ أَدْوَمُهَا وَإِنْ قَلَّ",en:"The most beloved deeds to Allah are the most consistent, even if small.",src:"Sahih al-Bukhari 6464, Sahih Muslim 783",topic:"Worship"},
{ar:"مَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللَّهُ لَهُ بِهِ طَرِيقًا إِلَى الْجَنَّةِ",en:"Whoever takes a path seeking knowledge, Allah makes easy for him a path to Paradise.",src:"Sahih Muslim 2699",topic:"Knowledge"},
{ar:"إِذَا مَاتَ ابْنُ آدَمَ انْقَطَعَ عَمَلُهُ إِلَّا مِنْ ثَلَاثٍ: صَدَقَةٍ جَارِيَةٍ، أَوْ عِلْمٍ يُنْتَفَعُ بِهِ، أَوْ وَلَدٍ صَالِحٍ يَدْعُو لَهُ",en:"When a person dies his deeds end except three: ongoing charity, knowledge that benefits others, or a righteous child who prays for him.",src:"Sahih Muslim 1631",topic:"Charity"},

{ar:"إِنَّ مِنْ أَحَبِّكُمْ إِلَيَّ أَحْسَنَكُمْ أَخْلَاقًا",en:"Among the most beloved to me are those with the best character.",src:"Sahih al-Bukhari 3559",topic:"Character"},
{ar:"أَكْمَلُ الْمُؤْمِنِينَ إِيمَانًا أَحْسَنُهُمْ خُلُقًا",en:"The believers with the most complete faith are those with the best character.",src:"Sunan Abi Dawud 4682, Jami at-Tirmidhi 1162",topic:"Character"},
{ar:"الْيَدُ الْعُلْيَا خَيْرٌ مِنَ الْيَدِ السُّفْلَى",en:"The giving hand is better than the receiving hand.",src:"Sahih al-Bukhari 1429, Sahih Muslim 1033",topic:"Charity"},
{ar:"مَا نَقَصَتْ صَدَقَةٌ مِنْ مَالٍ",en:"Charity never decreases wealth.",src:"Sahih Muslim 2588",topic:"Charity"},

{ar:"مَنْ صَامَ رَمَضَانَ إِيمَانًا وَاحْتِسَابًا غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ",en:"Whoever fasts Ramadan with faith and seeking reward, his previous sins are forgiven.",src:"Sahih al-Bukhari 38, Sahih Muslim 760",topic:"Worship"},
{ar:"الصِّيَامُ جُنَّةٌ",en:"Fasting is a shield.",src:"Sahih al-Bukhari 1894, Sahih Muslim 1151",topic:"Worship"},
{ar:"مَنْ قَامَ لَيْلَةَ الْقَدْرِ إِيمَانًا وَاحْتِسَابًا غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ",en:"Whoever stands in prayer on the Night of Decree with faith and seeking reward, his previous sins are forgiven.",src:"Sahih al-Bukhari 1901, Sahih Muslim 760",topic:"Worship"},
{ar:"الدُّعَاءُ هُوَ الْعِبَادَةُ",en:"Dua is worship.",src:"Jami at-Tirmidhi 2969, Sunan Abi Dawud 1479",topic:"Worship"},
{ar:"كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ ثَقِيلَتَانِ فِي الْمِيزَانِ حَبِيبَتَانِ إِلَى الرَّحْمَنِ: سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ",en:"Two words light on the tongue, heavy on the scale, beloved to the Most Merciful: Subhan Allah wa bihamdihi, Subhan Allah al-Azim.",src:"Sahih al-Bukhari 6406, Sahih Muslim 2694",topic:"Dhikr"},
{ar:"مَنْ قَالَ سُبْحَانَ اللَّهِ وَبِحَمْدِهِ فِي يَوْمٍ مِائَةَ مَرَّةٍ حُطَّتْ خَطَايَاهُ وَإِنْ كَانَتْ مِثْلَ زَبَدِ الْبَحْرِ",en:"Whoever says Subhan Allah wa bihamdihi a hundred times a day, his sins are wiped away even if they are like the foam of the sea.",src:"Sahih al-Bukhari 6405, Sahih Muslim 2691",topic:"Dhikr"},

{ar:"الْمُسْلِمُ أَخُو الْمُسْلِمِ لَا يَظْلِمُهُ وَلَا يُسْلِمُهُ، وَمَنْ كَانَ فِي حَاجَةِ أَخِيهِ كَانَ اللَّهُ فِي حَاجَتِهِ",en:"A Muslim is the brother of a Muslim: he does not wrong him or abandon him. Whoever helps his brother's need, Allah helps his need.",src:"Sahih al-Bukhari 2442, Sahih Muslim 2580",topic:"Community"},
{ar:"إِنَّمَا بُعِثْتُ لِأُتَمِّمَ صَالِحَ الْأَخْلَاقِ",en:"I was sent only to perfect good character.",src:"Musnad Ahmad 8952",topic:"Character"},
{ar:"الْبِرُّ حُسْنُ الْخُلُقِ",en:"Righteousness is good character.",src:"Sahih Muslim 2553",topic:"Character"},
{ar:"رِضَا الرَّبِّ فِي رِضَا الْوَالِدِ",en:"The pleasure of the Lord is in the pleasure of the parent.",src:"Jami at-Tirmidhi 1899",topic:"Family"},
{ar:"أُمُّكَ ثُمَّ أُمُّكَ ثُمَّ أُمُّكَ ثُمَّ أَبُوكَ",en:"Your mother, then your mother, then your mother, then your father.",src:"Sahih al-Bukhari 5971, Sahih Muslim 2548",topic:"Family"},
{ar:"خَيْرُكُمْ خَيْرُكُمْ لِأَهْلِهِ وَأَنَا خَيْرُكُمْ لِأَهْلِي",en:"The best of you are the best to their families, and I am the best to my family.",src:"Jami at-Tirmidhi 3895",topic:"Family"},

{ar:"آيَةُ الْمُنَافِقِ ثَلَاثٌ: إِذَا حَدَّثَ كَذَبَ، وَإِذَا وَعَدَ أَخْلَفَ، وَإِذَا اؤْتُمِنَ خَانَ",en:"The signs of a hypocrite are three: when he speaks he lies, when he promises he breaks it, and when trusted he betrays.",src:"Sahih al-Bukhari 33, Sahih Muslim 59",topic:"Honesty"},

{ar:"أَلَا وَإِنَّ فِي الْجَسَدِ مُضْغَةً إِذَا صَلَحَتْ صَلَحَ الْجَسَدُ كُلُّهُ",en:"In the body there is a piece of flesh: if it is sound, the whole body is sound. It is the heart.",src:"Sahih al-Bukhari 52, Sahih Muslim 1599",topic:"Heart"},

{ar:"تَهَادَوْا تَحَابُّوا",en:"Give gifts to one another and you will love one another.",src:"Al-Adab al-Mufrad 594",topic:"Community"},
{ar:"لَا تَحَاسَدُوا وَلَا تَبَاغَضُوا، وَكُونُوا عِبَادَ اللَّهِ إِخْوَانًا",en:"Do not envy or hate one another, and be servants of Allah as brothers.",src:"Sahih al-Bukhari 6064, Sahih Muslim 2559",topic:"Community"},
{ar:"إِيَّاكُمْ وَالظَّنَّ فَإِنَّ الظَّنَّ أَكْذَبُ الْحَدِيثِ",en:"Beware of suspicion, for suspicion is the falsest speech.",src:"Sahih al-Bukhari 6066, Sahih Muslim 2563",topic:"Character"},
{ar:"مَنْ يُحْرَمِ الرِّفْقَ يُحْرَمِ الْخَيْرَ",en:"Whoever is deprived of gentleness is deprived of good.",src:"Sahih Muslim 2592",topic:"Mercy"}];

/* ---------- prayer maths (offline, standard solar algorithm) ---------- */
const rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI,sn=d=>Math.sin(rad(d)),cs=d=>Math.cos(rad(d)),tn=d=>Math.tan(rad(d));
const fix=(a,b)=>{a=a-b*Math.floor(a/b);return a<0?a+b:a};
function julian(y,m,d){if(m<=2){y-=1;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sunPos(jd){const D=jd-2451545,g=fix(357.529+.98560028*D,360),q=fix(280.459+.98564736*D,360),Ls=fix(q+1.915*sn(g)+.02*sn(2*g),360),e=23.439-3.6e-7*D;const RA=fix(deg(Math.atan2(cs(e)*sn(Ls),cs(Ls)))/15,24);return{dec:deg(Math.asin(sn(e)*sn(Ls))),eq:q/15-RA}}
function prayerTimes(y,m,d,lat,lng,M){
  const jd=julian(y,m,d)-lng/360;
  const mid=x=>fix(12-sunPos(jd+x).eq,24);
  const ang=(a,x,ccw)=>{const dec=sunPos(jd+x).dec,v=(-sn(a)-sn(dec)*sn(lat))/(cs(dec)*cs(lat));if(v<-1||v>1)return NaN;return mid(x)+(ccw?-1:1)*deg(Math.acos(v))/15};
  const asr=x=>{const dec=sunPos(jd+x).dec;return ang(-deg(Math.atan(1/(1+tn(Math.abs(lat-dec))))),x)};
  let p={fajr:5/24,sunrise:6/24,dhuhr:.5,asr:13/24,maghrib:18/24,isha:18/24};
  for(let i=0;i<2;i++){p={fajr:ang(M.f,p.fajr,true),sunrise:ang(.833,p.sunrise,true),dhuhr:mid(p.dhuhr)+1/60,asr:asr(p.asr),maghrib:ang(.833,p.maghrib),isha:M.im?0:ang(M.i,p.isha)}}
  if(M.im)p.isha=p.maghrib+M.im/60;
  const base=Date.UTC(y,m-1,d),o={};
  for(const k in p)o[k]=new Date(base+(p[k]-lng/15)*36e5);
  return o}
function qibla(lat,lng){const a=rad(lat),b=rad(21.4225),dl=rad(39.8262-lng);return fix(deg(Math.atan2(Math.sin(dl),Math.cos(a)*Math.tan(b)-Math.sin(a)*Math.cos(dl))),360)}
function ymdIn(tz,date){const p=new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(date);const g=k=>+p.find(x=>x.type===k).value;return[g("year"),g("month"),g("day")]}

/* ---------- theme / lang chrome ---------- */
const root=document.documentElement;
function applyChrome(){
  root.lang=S.lang;root.dir=S.lang==="ar"?"rtl":"ltr";
  if(S.theme==="light"||S.theme==="dark"){root.setAttribute("data-theme",S.theme)}else root.removeAttribute("data-theme");
  if(S.theme==="emerald")root.setAttribute("data-skin","emerald");else root.removeAttribute("data-skin");
  $("#langBtn").textContent=S.lang==="ar"?"EN":"عربي";
  const names={auto:"Auto",light:"Light",dark:"Dark",emerald:"Emerald"};
  $("#themeBtn").innerHTML=ic("theme")+`<span>${names[S.theme]}</span>`;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  try{const f=(l)=>new Intl.DateTimeFormat(l,{day:"numeric",month:"long",year:"numeric"});
    const h=new Intl.DateTimeFormat(S.lang==="ar"?"ar-u-ca-islamic-umalqura":"en-u-ca-islamic-umalqura",{day:"numeric",month:"long",year:"numeric"}).format(new Date());
    $("#date").innerHTML=`<b>${esc(h)}</b> · ${esc(f(S.lang==="ar"?"ar":"en-GB").format(new Date()))}`}catch(e){$("#date").textContent=new Date().toDateString()}
}

const TABS=[["more","grid"],["quran","book"],["prayer","clock"]];
function buildNav(cur){
  $("#nav").innerHTML=NAV.map(([r,i])=>`<a href="#${r}" ${r===cur?'aria-current="page"':""}>${ic(i)}<span>${esc(t(r))}</span></a>`).join("");

}

   <div class="body" dir="auto">${esc(p.body)}</div>
   ${p.alt&&S.revealed["alt"+p.id]?`<div class="alt" dir="auto">${esc(p.alt)}</div>`:""}

    <button class="act dn" data-act="dislike" aria-pressed="${S.react[p.id]==="dislike"}" aria-label="Dislike">${ic("up")}${count(p,"dislike")}</button>

    <button class="act" data-act="save" aria-pressed="${S.saved.includes(p.id)}" aria-label="Save">${ic("mark")}</button>

   </div>
   ${S.revealed["c"+p.id]?`<div class="comments" style="margin-top:10px;display:grid;gap:8px">
     ${cm.map(c=>`<div class="sm"><b>@${esc(c.u)}</b> ${esc(c.t)}</div>`).join("")}
     <div class="row">${["Jazakallahu khayran","Barakallahu feek","Ameen"].map(s=>`<button class="chip" data-act="quick" data-s="${esc(s)}">${esc(s)}</button>`).join("")}</div>
     <div class="row"><input type="text" id="cin-${p.id}" placeholder="${esc(L("Write a respectful comment…","اكتب تعليقًا مهذبًا…"))}" class="grow" style="width:auto"><button class="btn sm" data-act="send">${esc(L("Send","إرسال"))}</button></div></div>`:""}
  </article>`}
function composer(){

const V={};
V.home=()=>head(t("home"),t("homeSub"))+composer()+(allPosts().length?allPosts().map(postHTML).join(""):`<div class="card flat muted">${esc(L("No posts yet. Be the first to share something beneficial.","لا توجد منشورات بعد. كن أول من يشارك ما ينفع."))}</div>`);
V.saved=()=>{const l=allPosts().filter(p=>S.saved.includes(p.id));return head(t("saved"),t("savedSub"))+(l.length?l.map(postHTML).join(""):`<div class="card flat muted">${esc(L("Nothing saved yet. Tap the bookmark on any post.","لا شيء محفوظ بعد. اضغط على العلامة في أي منشور."))}</div>`)};

V.explore=()=>head(t("explore"),t("exploreSub"))+`<input type="search" id="q" placeholder="${esc(t("search"))}  ( / )" aria-label="Search" value="${esc(S.q||"")}"><div class="row">${["Quran","Dua","Kindness","Study","Intention"].map(x=>`<button class="chip" data-act="tag" data-s="${x}">#${x}</button>`).join("")}</div><div id="results" style="display:grid;gap:12px"></div>`;
function searchResults(q){
  q=q.trim().toLowerCase();const out=[];if(!q)return `<div class="card flat muted">${esc(L("Type to search across posts, surahs, hadith and reciters.","اكتب للبحث في المنشورات والسور والأحاديث والقرّاء."))}</div>`;
  const posts=allPosts().filter(p=>(p.body+" "+(p.alt||"")+" "+p.u).toLowerCase().includes(q));
  const sur=AR.map((a,i)=>[i+1,a,EN[i]]).filter(s=>s[1].includes(q)||s[2].toLowerCase().includes(q)).slice(0,6);
  const had=HADITH.filter(h=>(h.en+h.ar+h.topic+h.src).toLowerCase().includes(q));
  const qr=QARIS.filter(x=>(x[0]+x[1]).toLowerCase().includes(q));
  if(sur.length)out.push(`<div class="card"><b>${esc(t("quran"))}</b>${sur.map(s=>`<div><a href="#quran" data-act="opensurah" data-n="${s[0]}">${s[0]}. ${esc(s[2])} · ${esc(s[1])}</a></div>`).join("")}</div>`);
  if(had.length)out.push(`<div class="card"><b>${esc(t("hadith"))}</b>${had.map(h=>`<div class="sm" style="margin-top:6px">${esc(h.en)} <span class="muted">(${esc(h.src)})</span></div>`).join("")}</div>`);
  if(qr.length)out.push(`<div class="card"><b>${esc(t("qaris"))}</b>${qr.map(x=>`<div>${esc(x[0])} · ${esc(x[1])}</div>`).join("")}</div>`);
  out.push(...posts.map(postHTML));
  return out.length?out.join(""):`<div class="card flat muted">${esc(L("No results.","لا نتائج."))}</div>`}

const LOAD={};
function loadSurah(n){
  if(TEXT[n]||LOAD[n]==="loading")return;
  const c=store.get("q"+n,null);if(c){TEXT[n]=c;return}
  LOAD[n]="loading";
  fetch("https://api.alquran.cloud/v1/surah/"+n+"/editions/quran-uthmani,en.sahih").then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{
    const ar=j.data[0].ayahs.map(a=>a.text),en=j.data[1].ayahs.map(a=>a.text);
    const norm=x=>x.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g,"").replace(/\u0671/g,"\u0627");
    if(n!==1&&n!==9&&norm(ar[0]).indexOf("\u0628\u0633\u0645 \u0627\u0644\u0644\u0647 \u0627\u0644\u0631\u062D\u0645\u0646 \u0627\u0644\u0631\u062D\u064A\u0645")===0){const w=ar[0].split(" ");if(w.length>4)ar[0]=w.slice(4).join(" ")}
    TEXT[n]={ar:ar,en:en,live:true};store.set("q"+n,TEXT[n]);LOAD[n]="ok";
  }).catch(()=>{LOAD[n]="err"}).then(()=>{if(S.surah===n&&(location.hash.slice(1)||"more")==="quran")render()});
}
const RECS=[["ar.alafasy","Mishary Alafasy","مشاري العفاسي"],["ar.abdulbasitmurattal","Abdul Basit Abdus Samad","عبد الباسط عبد الصمد"],["shuraim","Saud Ash-Shuraim","سعود الشريم"]];
function audioHTML(n){
  const r=S.reciter||"ar.alafasy";
  const sel=`<select id="reciter" aria-label="Reciter" style="width:100%">${RECS.map(x=>`<option value="${x[0]}" ${x[0]===r?"selected":""}>${esc(S.lang==="ar"?x[2]:x[1])}</option>`).join("")}</select>`;
  const url=r==="shuraim"?"https://surahquran.com/English/Al-Shuraim/"+n+".html":"https://cdn.islamic.network/quran/audio-surah/128/"+r+"/"+n+".mp3";
  const player=r==="shuraim"?`<a class="btn" style="text-align:center" href="${url}" target="_blank" rel="noopener">${esc(L("Listen to this surah ↗","استمع إلى هذه السورة ↗"))}</a>`:`<audio controls preload="none" src="${url}" style="width:100%"></audio><a class="muted sm" href="${url}" target="_blank" rel="noopener">${esc(L("Not playing? Open the audio ↗","لا يعمل؟ افتح الصوت ↗"))}</a>`;
  return `<div class="card flat" style="display:grid;gap:10px"><b>${esc(L("Listen","استماع"))}</b>${sel}${player}</div>`;
}
V.quran=()=>{
  const n=S.surah;
  if(!n)return head(t("quran"),t("quranSub"))+`<div class="notice">${esc(L("All 114 surahs are here. The text loads online when you open a surah, then it is saved on this device.","السور الـ114 كلها متاحة. يُحمَّل النص من الإنترنت عند فتح السورة ثم يُحفظ على جهازك."))}</div><div class="grid2">${AR.map((a,i)=>`<button class="card item" data-act="surah" data-n="${i+1}"><span><span class="num">${i+1}</span>${esc(EN[i])}</span><span class="ar" style="font-size:20px;line-height:1.4">${esc(a)}</span></button>`).join("")}</div>`;
  loadSurah(n);const d=TEXT[n];
  let body;
  if(!d)body=`<div class="card flat" style="display:grid;gap:10px"><span>${esc(LOAD[n]==="err"?L("Could not load the text. Check your internet connection.","تعذر تحميل النص. تحقق من اتصالك بالإنترنت."):L("Loading the surah…","جارٍ تحميل السورة…"))}</span><a class="btn" style="text-align:center" href="https://quran.com/${n}" target="_blank" rel="noopener">${esc(L("Read this surah on Quran.com","اقرأ هذه السورة على Quran.com"))} ↗</a></div>`;
  else body=d.ar.map((a,i)=>{
    let html;
    if(S.hifz){html=a.split(" ").map((w,j)=>((j+i)%3===1&&!S.revealed[`h${n}-${i}-${j}`])?`<button class="blank" data-act="reveal" data-k="h${n}-${i}-${j}" aria-label="Hidden word">${"ـ".repeat(Math.max(2,Math.min(w.length,6)))}</button>`:esc(w)).join(" ")}
    else html=esc(a);
    return `<div class="card"><div class="ar ayah">${html} <span class="muted" style="font-size:18px">﴿${i+1}﴾</span></div>${S.hifz?"":`<p class="muted" style="margin:6px 0 0" dir="ltr">${esc(d.en[i])}</p>`}</div>`}).join("");
  return `<button class="chip" data-act="back" style="align-self:flex-start">← ${esc(t("quran"))}</button><div class="ph"><h1 class="ar" style="font-size:38px;color:var(--gold-ink);text-align:center">${esc(AR[n-1])}</h1><p style="text-align:center">${esc(EN[n-1])}</p></div>
   ${audioHTML(n)}${d?`<div class="row"><button class="chip" data-act="hifz" aria-pressed="${S.hifz}">${esc(L("Hifz test: hide words","اختبار الحفظ: إخفاء كلمات"))}</button>${S.hifz?`<button class="chip" data-act="hifzreset">${esc(L("Reset","إعادة"))}</button>`:""}</div>`:""}${body}${d?`<p class="muted sm">${esc(d.live?L("English: Saheeh International translation, loaded from alquran.cloud.","الإنجليزية: ترجمة صحيح إنترناشيونال من alquran.cloud."):L("English lines are short paraphrases of the meaning, not an official translation.","المعاني المعروضة تفسير مختصر وليست ترجمة معتمدة."))}</p>`:""}`};

const MQ={list:null,state:"idle"},QS={i:-1,m:0,cur:0};
const mqNorm=x=>x.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/(^|\s)(عبد|ابو|ابي)\s+/g,"$1$2").replace(/\s+/g," ").trim();
const mqKey=x=>{const t=mqNorm(x).split(" ").filter(Boolean).map(w=>w.replace(/^ال/,""));return t.length?t[0]+"|"+t[t.length-1]:""};
function mqFor(i){const k=mqKey(QARIS[i][1]);return (MQ.list||[]).filter(r=>mqKey(r.name)===k).flatMap(r=>(r.moshaf||[]).map(m=>Object.assign({},m,{rname:r.name}))).filter(m=>m.server&&m.surah_list)}
function loadReciters(){MQ.state="loading";
  fetch("https://www.mp3quran.net/api/v3/reciters?language=ar").then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{MQ.list=j.reciters||[];MQ.state="ok"}).catch(()=>{MQ.state="err"}).then(()=>{if(["qari","qaris"].includes(location.hash.slice(1)))render()});}
function qPlay(n){const ms=QS.ms||[],m=ms[QS.m],a=$("#qa");if(!m||!a)return;QS.cur=n;$("#qmsg").textContent="";
  a.src=m.server+String(n).padStart(3,"0")+".mp3";a.play().catch(()=>{});$("#qnow").textContent=n+". "+EN[n-1]+" · "+AR[n-1];
  document.querySelectorAll("[data-row]").forEach(r=>r.classList.toggle("playing",+r.dataset.row===n));}
document.addEventListener("ended",e=>{if(e.target.id!=="qa")return;const m=(QS.ms||[])[QS.m];if(!m)return;const av=new Set(m.surah_list.split(",").map(Number));for(let n=QS.cur+1;n<=114;n++)if(av.has(n)){qPlay(n);return}},true);
document.addEventListener("error",e=>{if(e.target.id==="qa"&&e.target.getAttribute("src")){const m=$("#qmsg");if(m)m.textContent=L("This recording could not be played. Try another surah or reciter.","تعذر تشغيل هذا التسجيل. جرّب سورة أو قارئًا آخر.")}},true);
V.qari=()=>{
  const R=S.qid!=null&&MQ.list?MQ.list.find(r=>r.id===S.qid):null;
  const i=S.qid!=null?"r"+S.qid:(S.qari!=null&&QARIS[S.qari]?S.qari:0),q=S.qid!=null?[R?R.name:"…",R?R.name:"…"]:QARIS[i];
  const title=head(S.lang==="ar"?q[1]:q[0],S.qid!=null?L("Mujawwad recitation","التلاوة المجوّدة"):(S.lang==="ar"?q[0]:q[1]));
  const back=`<p><a class="btn" href="#qaris">← ${esc(L("All reciters","كل القرّاء"))}</a></p>`;
  if(MQ.state==="idle")loadReciters();
  if(MQ.state!=="ok")return title+back+(MQ.state==="err"?`<div class="notice">${esc(L("Could not load the recitations. Check your internet connection and try again.","تعذر تحميل التلاوات. تحقق من الإنترنت وحاول مرة أخرى."))} <a href="https://mp3quran.net" target="_blank" rel="noopener">mp3quran.net ↗</a></div>`:`<div class="card flat">${esc(L("Loading recitations…","جارٍ تحميل التلاوات…"))}</div>`);
  const ms=S.qid!=null?(R?mqMoshaf(R):[]):mqFor(i);QS.ms=ms;
  if(!ms.length)return title+back+`<div class="notice">${esc(L("No recordings were found for this reciter.","لم يتم العثور على تسجيلات لهذا القارئ."))} <a href="https://mp3quran.net" target="_blank" rel="noopener">mp3quran.net ↗</a></div>`;
  if(QS.i!==i){QS.i=i;QS.cur=0;let b=0;ms.forEach((m,k)=>{const sc0=x=>(S.qid!=null&&/مجود/.test(x.name)?2000:0)+(/حفص/.test(x.name)&&/مرتل/.test(x.name)?1000:0)+(+x.surah_total||0);if(sc0(m)>sc0(ms[b]))b=k});QS.m=b}
  const m=ms[Math.min(QS.m,ms.length-1)],av=new Set(m.surah_list.split(",").map(Number));
  const rows=Array.from({length:114},(_,k)=>k+1).map(n=>`<div class="card row sb" data-row="${n}"><div><b>${n}. ${esc(EN[n-1])}</b> <span class="muted">· ${esc(AR[n-1])}</span></div>${av.has(n)?`<button class="chip" data-act="qplay" data-n="${n}" aria-label="Play">▶ ${esc(L("Play","تشغيل"))}</button>`:`<span class="muted sm">${esc(L("Not available","غير متوفرة"))}</span>`}</div>`).join("");
  return title+back+`<div class="card" style="position:sticky;top:8px;z-index:5;display:grid;gap:8px"><b id="qnow">${esc(L("Choose a surah to play","اختر سورة للاستماع"))}</b><audio id="qa" controls preload="none" style="width:100%"></audio><div class="muted sm" id="qmsg"></div>${ms.length>1?`<select id="moshaf" aria-label="Recitation">${ms.map((x,k)=>`<option value="${k}" ${k===QS.m?"selected":""}>${esc(x.name)} (${x.surah_total})</option>`).join("")}</select>`:`<span class="muted sm">${esc(m.name)} · ${m.surah_total} ${esc(L("surahs","سورة"))}</span>`}</div>${rows}`;
};
V.qaris=()=>{const f=S.qf||"all";const l=QARIS.filter(x=>f==="all"||x[2]===f||x[2]==="both");
  return head(t("qaris"),t("qarisSub"))+`<div class="notice">${esc(L("Tap a reciter to see all 114 surahs in his voice and play them.","اضغط على قارئ لعرض السور الـ114 بصوته والاستماع إليها."))}</div>
  <div class="row">${[["all",L("All","الكل")],["murattal",L("Murattal","مرتّل")],["mujawwad",L("Mujawwad","مجوّد")]].map(([k,v])=>`<button class="chip" data-act="qf" data-s="${k}" aria-pressed="${f===k}">${esc(v)}</button>`).join("")}</div>
  <div class="grid2">${l.map(x=>`<div class="card" data-act="qari" data-i="${QARIS.indexOf(x)}" role="button" tabindex="0" style="cursor:pointer"><b>${esc(x[0])}</b><div class="ar" style="font-size:20px;line-height:1.6">${esc(x[1])}</div><span class="tag">${x[2]==="both"?"Murattal · Mujawwad":x[2]}</span><div class="muted sm" style="margin-top:6px">▶ ${esc(L("Tap to listen to all surahs","اضغط للاستماع إلى كل السور"))}</div></div>`).join("")}</div>`};

const mqMoshaf=R=>(R.moshaf||[]).map(m=>Object.assign({},m,{rname:R.name})).filter(m=>m.server&&m.surah_list).sort((a,b)=>(/مجود/.test(b.name)?1:0)-(/مجود/.test(a.name)?1:0));
const mujAll=()=>(MQ.list||[]).filter(r=>(r.moshaf||[]).some(m=>/مجود/.test(m.name)&&m.server&&m.surah_list)).sort((a,b)=>a.name.localeCompare(b.name,"ar"));
function mujShown(){const q=mqNorm(S.qs||"");return mujAll().filter(r=>!q||mqNorm(r.name).includes(q))}
function mujUpdate(){const a=mujShown(),all=mujAll().length;$("#qlist").innerHTML=a.map(r=>`<div class="card" data-act="qid" data-id="${r.id}" role="button" tabindex="0" style="cursor:pointer"><b class="ar" style="font-size:20px;line-height:1.6">${esc(r.name)}</b><div><span class="tag">Mujawwad</span></div><div class="muted sm" style="margin-top:6px">▶ ${esc(L("Tap to listen to all surahs","اضغط للاستماع إلى كل السور"))}</div></div>`).join("")||`<p class="muted">${esc(L("No reciters found.","لا يوجد قرّاء."))}</p>`;$("#qcount").textContent=a.length+" / "+all+" "+L("mujawwad reciters","قارئًا بالتلاوة المجوّدة")}
const _qa=V.qaris;

  if(MQ.state!=="ok")return h.slice(0,k)+`<div class="card flat">${esc(L("Loading mujawwad reciters…","جارٍ تحميل القرّاء المجوّدين…"))}</div>`;
  return h.slice(0,k)+`<input type="search" id="qsearch" value="${esc(S.qs||"")}" placeholder="${esc(L("Search reciters…","ابحث عن قارئ…"))}" style="width:100%;margin:8px 0"><p class="muted sm"><b id="qcount"></b></p><div class="grid2" id="qlist"></div>`;
};
V.hadith=()=>head(t("hadith"),t("hadithSub"))+HADITH.map(h=>`<article class="card"><div class="ar" style="font-size:24px">${esc(h.ar)}</div><p style="margin:6px 0">${esc(h.en)}</p><div class="row sb"><span class="muted sm">${esc(h.src)}</span><span class="tag">${esc(h.topic)}</span></div></article>`).join("")+`<p class="muted sm">${esc(L("English lines are paraphrases. Check the cited collection for the exact wording and grading.","الإنجليزية بتصرّف. راجع المصدر المذكور للنص الدقيق والدرجة."))}</p>`;

V.prayer=()=>{
  const c=CITIES[S.city]||CITIES.Cairo,M=METHODS[S.method]||METHODS.egypt;
  return head(t("prayer"),t("prayerSub"))+`<div class="row"><select id="city" aria-label="City" style="width:auto;flex:1">${Object.keys(CITIES).map(k=>`<option ${k===S.city?"selected":""}>${esc(k)}</option>`).join("")}</select><select id="method" aria-label="Method" style="width:auto;flex:1">${Object.entries(METHODS).map(([k,v])=>`<option value="${k}" ${k===S.method?"selected":""}>${esc(v.n)}</option>`).join("")}</select></div>

/* ---------- router ---------- */
function render(){
  const r=(location.hash.slice(1)||"more");const route=V[r]&&r!=="home"&&r!=="explore"?r:"more";
  clearInterval(timer);stopQibla();
  buildNav(route);
  $("#main").innerHTML=V[route]();
  if(route==="prayer"){startPrayer();qdraw()}
  if(route==="qaris"&&$("#qlist"))mujUpdate();
  if(route==="explore")$("#results").innerHTML=searchResults(S.q||"");
  window.scrollTo(0,0);
}

main.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,card=b.closest("[data-id]"),id=card&&card.dataset.id,keep=()=>{const y=window.scrollY;render();window.scrollTo(0,y)};
  if(act==="join"){const v=$("#uname").value.trim().replace(/[^A-Za-z0-9_.]/g,"");if(v.length<3){$("#uname").setCustomValidity("");$("#uname").placeholder="3+ letters or numbers";return}S.user=v;save();keep()}
  else if(act==="post"){const v=$("#newpost").value.trim();if(!v)return;S.posts.unshift({id:"u"+Date.now(),u:S.user,at:Date.now(),body:v,likes:0,dis:0});save();keep()}
  else if(act==="like"||act==="dislike"){S.react[id]=S.react[id]===act?undefined:act;if(!S.react[id])delete S.react[id];save();keep()}
  else if(act==="save"){S.saved=S.saved.includes(id)?S.saved.filter(x=>x!==id):S.saved.concat(id);save();keep()}
  else if(act==="report"){if(!S.reported.includes(id))S.reported.push(id);save();keep()}
  else if(act==="alt"){S.revealed["alt"+id]=!S.revealed["alt"+id];save();keep()}
  else if(act==="cmt"){S.revealed["c"+id]=!S.revealed["c"+id];keep()}
  else if(act==="quick"){const i=$("#cin-"+id);if(i)i.value=b.dataset.s}
  else if(act==="send"){const i=$("#cin-"+id),v=i&&i.value.trim();if(!v)return;if(!S.user){i.value="";i.placeholder="Choose a display name on Home first";return}(S.comments[id]=S.comments[id]||[]).push({u:S.user,t:v});save();keep()}
  else if(act==="tag"){S.q=b.dataset.s;$("#q").value=S.q;$("#results").innerHTML=searchResults(S.q)}
  else if(act==="surah"||act==="opensurah"){S.surah=+b.dataset.n;S.hifz=false;if(act==="surah")render();else{location.hash="quran"}}
  else if(act==="back"){S.surah=null;render()}
  else if(act==="hifz"){S.hifz=!S.hifz;keep()}
  else if(act==="hifzreset"){for(const k in S.revealed)if(k[0]==="h")delete S.revealed[k];save();keep()}
  else if(act==="reveal"){S.revealed[b.dataset.k]=true;save();keep()}
  else if(act==="qstart"){startQibla()}
  else if(act==="yt"){b.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${b.dataset.id}?autoplay=1&rel=0" title="YouTube video" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;b.removeAttribute("data-act");b.style.cursor="default"}
  else if(act==="ac"){S.ac=b.dataset.s;save();keep()}
  else if(act==="plan"){S.plan=+b.dataset.i;location.hash="plan"}
  else if(act==="pstep"){const i=+b.dataset.i,k=+b.dataset.k;S.plans=S.plans||{};const a=S.plans[i]||[];S.plans[i]=a.includes(k)?a.filter(v=>v!==k):a.concat(k);save();keep()}
  else if(act==="popen"){S.surah=+b.dataset.n;save();location.hash="quran"}
  else if(act==="qari"){S.qari=+b.dataset.i;S.qid=null;location.hash="qari"}
  else if(act==="qid"){S.qid=+b.dataset.id;QS.i=-1;location.hash="qari"}
  else if(act==="qplay"){qPlay(+b.dataset.n)}
  else if(act==="qf"){S.qf=b.dataset.s;keep()}
  else if(act==="dhikr"){const i=+b.dataset.i,n=ADHKAR[i].n;S.adhkar.done[i]=Math.min((S.adhkar.done[i]||0)+1,n);
    if(ADHKAR.every((a,k)=>!a.core||(S.adhkar.done[k]||0)>=a.n)&&S.streak.last!==dayKey()){const y=new Date(Date.now()-864e5).toDateString();S.streak={n:S.streak.last===y?S.streak.n+1:1,last:dayKey()}}
    save();keep()}
  else if(act==="rsvp"){const i=+b.dataset.i;S.rsvp=S.rsvp.includes(i)?S.rsvp.filter(x=>x!==i):S.rsvp.concat(i);save();keep()}
});

const bm=XS.g("bm",[]);xe("x-out",q.data.ayahs.map(a=>`<div class="card" style="margin-bottom:10px"><p style="font-family:var(--font-quran);font-size:24px;line-height:2;margin:0">${esc(a.text)} ﴿${a.numberInSurah}﴾</p><div class="row" style="margin-top:6px"><button class="chip" data-x="bm" data-v="${X.sur}:${a.numberInSurah}">${bm.includes(X.sur+":"+a.numberInSurah)?"★":"☆"} ${esc(L("Save","احفظ"))}</button></div><details><summary class="sm muted" style="cursor:pointer;padding:6px 0">${esc(L("Tafsir","التفسير"))}</summary><p style="line-height:1.9;margin:0">${esc(tf[a.numberInSurah]||L("No text for this ayah in this book.","لا يوجد نص لهذه الآية في هذا التفسير."))}</p></details></div>`).join(""))}catch(e){xerr("x-out",e.message)}}
/* --- reciters --- */
const TEN=[["نافع",[["قالون","قالون"],["ورش","ورش"]]],["ابن كثير",[["البزي","البزي"],["قنبل","قنبل"]]],["أبو عمرو البصري",[["الدوري","الدوري عن ابي عمرو"],["السوسي","السوسي"]]],["ابن عامر",[["هشام","هشام"],["ابن ذكوان","ابن ذكوان"]]],["عاصم",[["شعبة","شعبه"],["حفص","حفص"]]],["حمزة",[["خلف عن حمزة","خلف عن حمزه"],["خلاد","خلاد"]]],["الكسائي",[["أبو الحارث","ابي الحارث"],["الدوري","الدوري عن الكسائي"]]],["أبو جعفر",[["ابن وردان","ابن وردان"],["ابن جماز","ابن جماز"]]],["يعقوب",[["رويس","رويس"],["روح","روح"]]],["خلف العاشر",[["إسحاق","اسحاق"],["إدريس","ادريس"]]]];
const KIND={"":"الكل",murattal:"مرتل",mujawwad:"مجوّد",rare:"نادر ومحافل"};
const kindOf=n=>{n=XN(n);return /نادر|محفل|حفل|احياء|مقطع|تراويح|قيام/.test(n)?"rare":/مجود/.test(n)?"mujawwad":"murattal"};
V.reciters2=()=>{setTimeout(xRec);const r=X.rec;return head(t("reciters2"),L("Filter by style, narration and country","فلتر بالنوع والرواية والبلد"))+`<input type="search" id="x-q" value="${esc(r.q)}" placeholder="${esc(L("Search reciters…","ابحث عن قارئ…"))}">`+chips(Object.entries(KIND),r.kind,"kind")+`<div class="row"><button class="chip" data-x="eg" aria-pressed="${r.eg}">🇪🇬 ${esc(L("Egyptian only","المصريون فقط"))}</button>${r.rw?`<button class="chip" data-x="rw0">✕ ${esc(r.rwl||r.rw)}</button>`:""}</div><details class="card flat"><summary class="sm">${esc(L("Add Egyptian reciter names (one per line)","أضف أسماء قرّاء مصريين (اسم في كل سطر)"))}</summary><textarea id="x-eg" rows="4">${esc((XS.g("eg",[])).join("\n"))}</textarea></details><div class="card" style="position:sticky;top:60px;z-index:5" id="x-now" hidden><b id="x-nt"></b><audio id="x-au" controls style="width:100%"></audio></div><div id="x-out">…</div>`};
async function xRec(){try{const j=await xj("https://www.mp3quran.net/api/v3/reciters?language=ar"),r=X.rec,eg=XEG.concat(XS.g("eg",[])).map(XN);const sn=AR;let n=0;
const html=j.reciters.filter(c=>{const a=XN(c.name);return(!r.eg||eg.some(e=>a.includes(e)||e.includes(a)))&&(!r.q||a.includes(XN(r.q)))}).map(c=>{const ms=(c.moshaf||[]).map(m=>({m,k:kindOf(m.name),sl:(m.surah_list||"").split(",").filter(Boolean).map(Number)})).filter(o=>o.sl.length&&(!r.kind||o.k===r.kind)&&(!r.rw||XN(o.m.name).includes(r.rw)));if(!ms.length)return"";n++;
return`<details class="card" style="margin-bottom:8px"><summary><b>${esc(c.name)}</b></summary>${ms.map(o=>`<p class="sm" style="color:var(--primary);font-weight:700;margin:10px 0 4px">${esc(o.m.name)} · ${esc(KIND[o.k])} · ${o.sl.length} ${esc(L("surahs","سورة"))}</p><div class="row">${o.sl.map(s=>`<button class="chip" data-x="play" data-u="${esc(o.m.server.replace(/\/?$/,"/")+String(s).padStart(3,"0")+".mp3")}" data-t="${esc(c.name+" — "+(sn[s-1]||s))}">${esc(sn[s-1]||s)}</button>`).join("")}</div>`).join("")}</details>`}).join("");
xe("x-out",`<p class="muted sm">${n} ${esc(L("reciters","قارئ"))} — ${esc(L("only surahs actually recorded in this style are listed","تظهر فقط السور المسجّلة فعلًا بهذا النوع"))}</p>`+(html||`<div class="card flat">${esc(L("No results","لا نتائج"))}</div>`))}catch(e){xerr("x-out",e.message)}}
V.tajweed=()=>head(t("tajweed"),L("Rules + the ten readers and their narrators","أحكام أساسية والقرّاء العشرة ورواتهم"))+`<div class="card"><b>أحكام أساسية</b><p style="line-height:1.9;margin:6px 0 0">النون الساكنة والتنوين: إظهار، إدغام، إقلاب، إخفاء.<br>الميم الساكنة: إخفاء شفوي، إدغام مثلين، إظهار شفوي.<br>المدود: طبيعي (حركتان)، متصل ومنفصل، لازم، عارض للسكون.<br>القلقلة: حروف «قطب جد» إذا سكنت.<br>الغنة: صوت الخيشوم في النون والميم المشددتين.</p></div><p class="muted sm">${esc(L("Tap a narrator to hear reciters who recorded it.","اضغط على الراوي لتسمع من سجّل بروايته."))}</p>`+TEN.map(([q,rs])=>`<div class="card"><b>${esc(q)}</b><div class="row" style="margin-top:8px">${rs.map(([n,k])=>`<button class="chip" data-x="rawi" data-v="${esc(XN(k))}" data-l="${esc(n+" عن "+q)}">${esc(n)}</button>`).join("")}</div></div>`).join("");
/* --- books --- */
const BK={bukhari:["ara-bukhari","البخاري"],muslim:["ara-muslim","مسلم"],nawawi:["ara-nawawi","الأربعون النووية"]};
V.books=()=>{setTimeout(xBook);return head(t("books"),"")+chips(Object.entries(BK).map(([k,v])=>[k,v[1]]),X.book.b,"bk")+`<input type="search" id="x-bq" value="${esc(X.book.q)}" placeholder="${esc(L("Search in hadith text","ابحث في نص الحديث"))}"><div id="x-out">…</div>`};
async function xBook(){const b=X.book;try{const all=(await xj(`https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/${BK[b.b][0]}.json`)).hadiths;const q=XN(b.q);const l=q?all.filter(h=>XN(h.text).includes(q)):all,pg=Math.max(1,Math.ceil(l.length/20));b.p=Math.min(b.p,pg);
xe("x-out",l.slice((b.p-1)*20,b.p*20).map(h=>`<div class="card" style="margin-bottom:8px"><span class="tag">${esc(L("Hadith","حديث"))} ${h.hadithnumber}</span><p style="line-height:2;margin:6px 0 0">${esc(h.text)}</p></div>`).join("")+`<div class="row sb"><button class="btn sm" data-x="bpg" data-v="-1" ${b.p<=1?"disabled":""}>‹</button><span>${b.p} / ${pg} · ${l.length}</span><button class="btn sm" data-x="bpg" data-v="1" ${b.p>=pg?"disabled":""}>›</button></div>`)}catch(e){xerr("x-out",e.message)}}
/* --- seerah / sahaba / imams --- */
["seerah","sahaba","imams"].forEach(k=>V[k]=()=>head(t(k),"")+XC[k].map(([a,b])=>`<div class="card"><b style="color:var(--primary)">${esc(a)}</b><p style="line-height:1.9;margin:6px 0 0">${esc(b)}</p></div>`).join("")+`<p class="muted sm">${esc(L("Short summaries; please verify with scholarly books.","ملخصات مختصرة، يُرجى مراجعة كتب أهل العلم."))}</p>`);
/* --- AI sheikh (your own API key, stored only in this browser) --- */
V.sheikh=()=>head(t("sheikh"),L("Scholarly assistant — not a replacement for scholars","مساعد علمي وليس بديلًا عن العلماء"))+`<details class="card flat" ${XS.g("key","")?"":"open"}><summary class="sm">API key</summary><input type="text" id="x-key" placeholder="sk-ant-…" value="${esc(XS.g("key",""))}"><p class="muted sm" style="margin:6px 0 0">${esc(L("Stored only in this browser and sent only to api.anthropic.com. Use a key with a spending limit.","يُحفظ في هذا المتصفح فقط ويُرسل إلى api.anthropic.com فقط. استخدم مفتاحًا بحد إنفاق."))}</p></details><div id="x-chat" style="display:grid;gap:8px">${xChat()}</div><textarea id="x-msg" placeholder="${esc(L("Ask your question","اكتب سؤالك"))}"></textarea><div class="row"><button class="btn" data-x="ask">${esc(L("Send","إرسال"))}</button><button class="btn ghost" data-x="newchat">${esc(L("New chat","محادثة جديدة"))}</button></div>`;
const xChat=()=>X.chat.map(m=>`<div class="card ${m.role==="user"?"flat":""}" style="white-space:pre-wrap;line-height:1.9">${esc(m.content)}</div>`).join("");
const SYS="أنت مساعد علمي إسلامي بأسلوب شيخ هادئ ومتواضع. أجب بالعربية مع ذكر الدليل من القرآن أو السنة الصحيحة عند الإمكان، وبيّن اختلاف المذاهب المعتبرة في المسائل الخلافية. لا تُصدر فتاوى في النوازل الشخصية الدقيقة وانصح بسؤال عالم موثوق. إن لم تكن متأكدًا فقل ذلك ولا تختلق نصًا أو سندًا.";
async function xAsk(){const ta=$("#x-msg"),v=ta.value.trim(),key=($("#x-key")||{}).value||XS.g("key","");if(!v)return;if(!key){alert(L("Add your API key first","أضف مفتاح API أولًا"));return}XS.s("key",key.trim());ta.value="";X.chat.push({role:"user",content:v});xe("x-chat",xChat()+`<div class="card flat">…</div>`);
try{const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key.trim(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-5-5",max_tokens:1200,system:SYS,messages:X.chat.slice(-12)})});const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);X.chat.push({role:"assistant",content:j.content.map(c=>c.text||"").join("")});XS.s("chat",X.chat.slice(-30));xe("x-chat",xChat())}catch(e){X.chat.pop();xe("x-chat",xChat()+`<div class="card flat">${esc(e.message)}</div>`)}}
/* --- courses (saved in this browser) --- */
const CK=[["","الكل"],["hifz","تحفيظ"],["tafsir","تفسير"],["hadith","حديث"],["fiqh","فقه"]];
V.courses=()=>{const sh=XS.g("sheikh",false),cs=XS.g("courses",[]).filter(c=>!X.cat||c.k===X.cat),en=XS.g("enr",[]);
return head(t("courses"),L("Free courses given by sheikhs","دورات مجانية يقدمها المشايخ"))+chips(CK,X.cat,"cat")+`<div class="row"><button class="chip" data-x="sheikhmode" aria-pressed="${sh}">${esc(L("I am a sheikh","أنا شيخ"))}</button></div>`+(sh?`<div class="card" style="display:grid;gap:8px"><b>${esc(L("Add a course","أضف دورة"))}</b><input type="text" id="x-ct" placeholder="${esc(L("Title","العنوان"))}"><select id="x-ck">${CK.slice(1).map(([a,b])=>`<option value="${a}">${b}</option>`).join("")}</select><textarea id="x-cd" placeholder="${esc(L("Description","الوصف"))}"></textarea><input type="text" id="x-cl" placeholder="${esc(L("Zoom / Meet / Telegram link","رابط الحلقة"))}"><button class="btn" data-x="addc">${esc(L("Publish","نشر"))}</button></div>`:"")+cs.map(c=>`<div class="card"><b>${esc(c.t)}</b> <span class="tag">${esc((CK.find(x=>x[0]===c.k)||[])[1]||"")}</span><p style="margin:6px 0">${esc(c.d||"")}</p><div class="row"><button class="btn sm" data-x="enr" data-v="${c.id}">${en.includes(c.id)?"✓ "+esc(L("Enrolled","مسجّل")):esc(L("Enroll","سجّل"))}</button>${/^https?:\/\//.test(c.l||"")?`<a class="chip" href="${esc(c.l)}" target="_blank" rel="noopener noreferrer">${esc(L("Class link","رابط الحلقة"))}</a>`:""}${sh?`<button class="chip" data-x="delc" data-v="${c.id}">🗑</button>`:""}</div></div>`).join("")+(cs.length?"":`<div class="card flat muted">${esc(L("No courses yet.","لا توجد دورات بعد."))}</div>`)+`<p class="muted sm">${esc(L("Courses are saved on this device. To share them between people, connect a backend (see the zip).","الدورات محفوظة على هذا الجهاز. لمشاركتها بين الناس اربطها بباك إند (موجود في ملف الـ Zip)."))}</p>`};
/* --- features --- */
V.features=()=>{const d=XF.filter(f=>f[1]).length;return head(t("features"),`${d} ${L("working","شغالة")} · ${XF.length-d} ${L("planned","قريبًا")}`)+XF.map(([a,r],i)=>r?`<a class="card row sb" href="#${r}"><span>${i+1}. ${esc(a)}</span><b style="color:var(--primary)">✓</b></a>`:`<div class="card row sb muted"><span>${i+1}. ${esc(a)}</span><span class="sm">${esc(L("soon","قريبًا"))}</span></div>`).join("")};
/* --- events for the new sections --- */
const rr=()=>{const y=scrollY;render();scrollTo(0,y)};
main.addEventListener("click",e=>{const b=e.target.closest("[data-x]");if(!b)return;const a=b.dataset.x,v=b.dataset.v;
if(a==="tf"){X.tf=v;rr()}else if(a==="bm"){let m=XS.g("bm",[]);m=m.includes(v)?m.filter(x=>x!==v):m.concat(v);XS.s("bm",m);b.firstChild.textContent=m.includes(v)?"★":"☆";b.firstChild.textContent+=""}
else if(a==="kind"){X.rec.kind=v;rr()}else if(a==="eg"){X.rec.eg=!X.rec.eg;rr()}else if(a==="rw0"){X.rec.rw="";rr()}
else if(a==="rawi"){X.rec.rw=v;X.rec.rwl=b.dataset.l;location.hash="reciters2"}
else if(a==="play"){$("#x-now").hidden=false;$("#x-nt").textContent=b.dataset.t;const au=$("#x-au");au.src=b.dataset.u;au.play().catch(()=>{})}
else if(a==="bk"){X.book.b=v;X.book.p=1;rr()}else if(a==="bpg"){X.book.p+=+v;xBook();scrollTo(0,0)}
else if(a==="ask")xAsk();else if(a==="newchat"){X.chat=[];XS.s("chat",[]);rr()}
else if(a==="cat"){X.cat=v;rr()}else if(a==="sheikhmode"){XS.s("sheikh",!XS.g("sheikh",false));rr()}
else if(a==="addc"){const t_=$("#x-ct").value.trim();if(!t_)return;const c=XS.g("courses",[]);c.unshift({id:"c"+Date.now(),t:t_,k:$("#x-ck").value,d:$("#x-cd").value.trim(),l:$("#x-cl").value.trim()});XS.s("courses",c);rr()}
else if(a==="enr"){let n=XS.g("enr",[]);n=n.includes(v)?n.filter(x=>x!==v):n.concat(v);XS.s("enr",n);rr()}
else if(a==="delc"){XS.s("courses",XS.g("courses",[]).filter(c=>c.id!==v));rr()}});
main.addEventListener("change",e=>{if(e.target.id==="x-sur"){X.sur=+e.target.value;rr()}});
let xt;main.addEventListener("input",e=>{const i=e.target.id;if(i==="x-q"||i==="x-bq"||i==="x-eg"){clearTimeout(xt);xt=setTimeout(()=>{if(i==="x-q"){X.rec.q=e.target.value;xRec()}else if(i==="x-bq"){X.book.q=e.target.value;X.book.p=1;xBook()}else{XS.s("eg",e.target.value.split("\n").map(s=>s.trim()).filter(Boolean));xRec()}},300)}});

applyChrome();render();
})();
</script>

</body>
</html>
